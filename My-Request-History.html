<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Request History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout idea: title and search on one row, status filter tabs, then a two-column grid of request cards. */
  --ink: #14173d;
  --ink-soft: #5b6188;
  --line: #e6eaf2;
  --green: #16a34a;
  --green-deep: #12803c;
  --green-tint: #eaf7ee;
  --green-line: #bfe6cb;
  --blue: #2f6fe4;
  --blue-tint: #e8f1ff;
  --blue-line: #c9dcfb;
  --yellow: #a8670a;
  --yellow-tint: #fff6dc;
  --yellow-line: #f1dd9c;
  --rose: #c8323f;
  --rose-tint: #fdecee;
  --rose-line: #f6c9ce;
  --slate: #56607f;
  --slate-tint: #eef1f7;
  --slate-line: #d9dfeb;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --shadow: 0 1px 2px rgba(20,23,61,.04), 0 12px 32px -14px rgba(20,23,61,.12);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); color: var(--ink); background: #fff; line-height: 1.45; -webkit-font-smoothing: antialiased; min-height: 100vh; padding: 32px 20px 56px; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
svg { display: block; flex: none; }
:focus-visible { outline: 3px solid rgba(22,163,74,.35); outline-offset: 2px; }
.pimg { display: block; object-fit: contain; }

.app { width: 100%; max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

/* ---------- Title + search ---------- */
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding: 4px 2px 0; }
.page-head h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
.page-head p { margin: 2px 0 0; font-size: 14px; color: var(--ink-soft); }
.search { position: relative; width: 340px; max-width: 100%; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); pointer-events: none; }
.search input { width: 100%; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; padding: 0 40px 0 42px; font-size: 14.5px; font-weight: 500; transition: border-color .15s, box-shadow .15s; }
.search input::placeholder { color: #a3a9c4; }
.search input:hover { border-color: #cfd6e6; }
.search input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 4px rgba(22,163,74,.12); }
.search .clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-soft); cursor: pointer; display: grid; place-items: center; }
.search .clear:hover { background: var(--rose-tint); color: var(--rose); }

/* ---------- Filter tabs ---------- */
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { height: 38px; padding: 0 14px 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; font-size: 13.5px; font-weight: 700; color: var(--ink-soft); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: background .15s, border-color .15s, color .15s; }
.tab:hover { border-color: #cdd5e6; color: var(--ink); }
.tab .n { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; background: #f1f3f9; color: var(--ink-soft); font-size: 12px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.tab.on { color: var(--c); background: var(--bg); border-color: var(--bl); }
.tab.on .n { background: #fff; color: var(--c); }
.t-all { --c: var(--ink); --bg: #f4f6fb; --bl: #d5dbe9; }
.t-pending { --c: var(--yellow); --bg: var(--yellow-tint); --bl: var(--yellow-line); }
.t-approved { --c: var(--green-deep); --bg: var(--green-tint); --bl: var(--green-line); }
.t-rejected { --c: var(--rose); --bg: var(--rose-tint); --bl: var(--rose-line); }
.t-expired { --c: var(--slate); --bg: var(--slate-tint); --bl: var(--slate-line); }
.count-line { font-size: 13px; color: var(--ink-soft); font-weight: 600; }

/* ---------- Cards ---------- */
.grid { display: flex; flex-direction: column; gap: 14px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); }
.req { display: flex; flex-direction: column; overflow: hidden; transition: box-shadow .15s, transform .15s; }
.req:hover { box-shadow: 0 1px 2px rgba(20,23,61,.04), 0 16px 34px -16px rgba(20,23,61,.2); }
.req.leaving { opacity: 0; transform: scale(.98); transition: opacity .22s, transform .22s; }
.logo-tile { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--tb); border: 1px solid var(--tl); color: var(--tc); flex: none; }
.tone-green { --tb: var(--green-tint); --tl: var(--green-line); --tc: var(--green-deep); }
.tone-blue { --tb: var(--blue-tint); --tl: var(--blue-line); --tc: var(--blue); }
.tone-yellow { --tb: var(--yellow-tint); --tl: var(--yellow-line); --tc: var(--yellow); }
.tone-red { --tb: var(--rose-tint); --tl: var(--rose-line); --tc: var(--rose); }
.status { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px 0 9px; border-radius: 999px; font-size: 13px; font-weight: 700; border: 1px solid transparent; white-space: nowrap; align-self: flex-start; }
.st-approved { background: var(--green-tint); color: var(--green-deep); border-color: var(--green-line); }
.st-pending { background: var(--yellow-tint); color: var(--yellow); border-color: var(--yellow-line); }
.st-rejected { background: var(--rose-tint); color: var(--rose); border-color: var(--rose-line); }
.st-expired { background: var(--slate-tint); color: var(--slate); border-color: var(--slate-line); }

/* header: who + status + action */
.rq-head { display: flex; align-items: center; gap: 18px; padding: 18px 22px; }
.rq-id { flex: 1; min-width: 0; display: flex; gap: 14px; align-items: center; }
.rq-id > div { min-width: 0; }
.rq-name { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -.01em; line-height: 1.25; }
.rq-meta { display: flex; flex-wrap: wrap; gap: 2px 18px; margin-top: 5px; font-size: 13px; font-weight: 500; color: var(--ink-soft); }
.rq-meta span, .rq-meta a { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.rq-meta svg { color: #98a0bb; }
.rq-meta a { color: var(--blue); font-weight: 600; text-decoration: none; }
.rq-meta a svg { color: var(--blue); }
.rq-meta a:hover { text-decoration: underline; }
.rq-side { display: flex; align-items: center; gap: 10px; flex: none; }
.rq-side .btn { height: 36px; padding: 0 14px; font-size: 13px; white-space: nowrap; }

/* body: four even columns on a quiet surface */
.rq-body { display: grid; grid-template-columns: 124px 132px 168px minmax(0, 1fr); gap: 0 28px; padding: 16px 22px 18px; background: #fafbfd; border-top: 1px solid var(--line); }
.col { min-width: 0; }
.col-prod { border-left: 1px solid var(--line); padding-left: 28px; }
.k { display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px; }
.cnt { min-width: 18px; height: 18px; padding: 0 6px; border-radius: 999px; background: #e9edf5; color: var(--ink-soft); font-size: 11px; display: inline-grid; place-items: center; letter-spacing: 0; }
.prods { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.prod { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px 0 8px; border-radius: 12px; background: #fff; border: 1px solid var(--cl); min-width: 0; }
.prod .pi { width: 30px; height: 30px; border-radius: 9px; background: var(--cb); display: grid; place-items: center; flex: none; }
.prod strong { font-size: 13px; line-height: 1.2; color: var(--ink); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pc-blue { --cb: var(--blue-tint); --cl: var(--blue-line); }
.pc-yellow { --cb: var(--yellow-tint); --cl: var(--yellow-line); }
.pc-green { --cb: var(--green-tint); --cl: var(--green-line); }
.val { font-size: 14px; font-weight: 700; line-height: 1.3; min-height: 30px; display: flex; align-items: center; }
.profile-pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 9px; background: #fff; color: var(--ink); border: 1px solid var(--line); font-size: 13.5px; font-weight: 700; }
.profile-pill svg { color: var(--blue); }
.meter { height: 6px; border-radius: 999px; background: #e9edf5; overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; border-radius: inherit; background: #f0b429; }
.meter.urgent i { background: #ef6b75; }
.sub { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-top: 2px; }
.sub.warn { color: var(--yellow); }
.sub.urgent { color: var(--rose); }
.remark { display: flex; gap: 12px; align-items: flex-start; padding: 13px 22px; background: var(--rose-tint); border-top: 1px solid var(--rose-line); }
.remark .ri { width: 28px; height: 28px; border-radius: 9px; background: #fff; border: 1px solid var(--rose-line); color: var(--rose); display: grid; place-items: center; flex: none; }
.remark .k { color: var(--rose); margin-bottom: 2px; }
.remark p { margin: 0; font-size: 13.5px; font-weight: 600; color: #7d2630; line-height: 1.45; }
.btn { height: 40px; padding: 0 18px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 13.5px; cursor: pointer; border: 1.5px solid transparent; transition: transform .05s, background .15s, box-shadow .15s; }
.btn:active { transform: translateY(1px); }
.btn-danger-soft { background: var(--rose-tint); color: var(--rose); border-color: var(--rose-line); }
.btn-danger-soft:hover { background: #fbdde0; }
.btn-soft { background: #f4f6fb; color: var(--ink); border-color: var(--line); }
.btn-soft:hover { background: #eceff6; }
.btn-danger { background: linear-gradient(180deg, #ef5560, #d63a46); color: #fff; box-shadow: 0 10px 22px -12px rgba(214,58,70,.8), inset 0 1px 0 rgba(255,255,255,.25); }
.btn-primary { background: linear-gradient(180deg, #1fb457 0%, #12923f 100%); color: #fff; box-shadow: 0 10px 22px -12px rgba(18,146,63,.75), inset 0 1px 0 rgba(255,255,255,.25); }

/* ---------- Empty ---------- */
.empty { border: 1.5px dashed #c9d3e6; border-radius: 22px; background: #fafbfe; padding: 44px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }
.empty .e-ico { width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center; background: var(--blue-tint); color: var(--blue); margin-bottom: 6px; }
.empty h3 { margin: 0; font-size: 18px; font-weight: 800; }
.empty p { margin: 0; font-size: 14px; color: var(--ink-soft); max-width: 46ch; }
.empty .btn { margin-top: 10px; }

/* ---------- Modal ---------- */
.overlay { position: fixed; inset: 0; background: rgba(20,23,61,.35); backdrop-filter: blur(2px); display: grid; place-items: center; padding: 20px; z-index: 20; }
.modal { width: 100%; max-width: 440px; background: #fff; border-radius: 22px; padding: 24px; box-shadow: 0 30px 70px -20px rgba(20,23,61,.45); }
.modal .m-ico { width: 48px; height: 48px; border-radius: 15px; background: var(--rose-tint); color: var(--rose); border: 1px solid var(--rose-line); display: grid; place-items: center; margin-bottom: 14px; }
.modal h3 { margin: 0 0 6px; font-size: 19px; font-weight: 800; }
.modal p { margin: 0; font-size: 14px; color: var(--ink-soft); }
.modal .who-box { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: #fafbfd; border: 1px solid var(--line); font-size: 13.5px; font-weight: 700; }
.modal .who-box small { display: block; font-weight: 600; color: var(--ink-soft); font-size: 12.5px; margin-top: 1px; }
.modal .m-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

/* ---------- Toast ---------- */
.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px 10px 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 18px 40px -12px rgba(20,23,61,.25); transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); z-index: 30; }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast .t-ico { width: 32px; height: 32px; border-radius: 10px; background: var(--rose-tint); color: var(--rose); display: grid; place-items: center; }
.toast strong { display: block; font-size: 13.5px; }
.toast span.b { font-size: 12.5px; color: var(--ink-soft); }
.toast .undo { border: 0; background: var(--green-tint); color: var(--green-deep); font-weight: 700; font-size: 13px; padding: 7px 12px; border-radius: 9px; cursor: pointer; }
.toast .undo:hover { background: #dcf2e3; }

@media (max-width: 960px) {
  .rq-body { grid-template-columns: 1fr 1fr 1fr; gap: 16px 24px; }
  .rq-body .col-prod { grid-column: 1 / -1; border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 16px; }
}
@media (max-width: 640px) {
  body { padding: 16px 14px 40px; }
  .page-head h1 { font-size: 24px; }
  .search { width: 100%; }
  .rq-head { flex-wrap: wrap; padding: 16px; }
  .rq-side { width: 100%; justify-content: space-between; }
  .rq-body { grid-template-columns: 1fr 1fr; padding: 16px; }
  .rq-body .col-exp { grid-column: 1 / -1; }
  .prods { grid-template-columns: 1fr; }
  .remark { padding: 13px 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

      <input type="text" id="q" placeholder="Search institution..." aria-label="Search institution" autocomplete="off">
      <button type="button" class="clear" id="qClear" aria-label="Clear search" hidden><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>

    { id: 1, name: "VIDYAOne Public School", city: "Lucknow", tone: "green", address: "24, Gomti Nagar Extension, Lucknow, Uttar Pradesh 226010", website: "www.vidyaone.edu.in", products: ["win"], profile: "Teacher", requested: "2026-11-18T11:20", status: "approved" },
    { id: 2, name: "St. Mary's Convent School", city: "Kanpur", tone: "blue", address: "12, Civil Lines, Kanpur, Uttar Pradesh 208001", website: "www.stmarysconvent.edu.in", products: ["win", "web", "online"], profile: "Staff", requested: "2026-11-16T16:35", status: "pending" },
    { id: 3, name: "Green Valley Academy", city: "Noida", tone: "yellow", address: "B-7, Sector 62, Noida, Uttar Pradesh 201309", website: "www.greenvalley.edu.in", products: ["web"], profile: "Student", requested: "2026-11-14T10:10", status: "rejected", remark: "Student requests need a school ID number. Please add it and send the request again." }
  ];

  /* ---- dates ---- */
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function fmtDate(d) { return pad(d.getDate()) + " " + MON[d.getMonth()] + " " + d.getFullYear(); }
  function fmtTime(d) { var h = d.getHours(), m = d.getMinutes(), ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return pad(h) + ":" + pad(m) + " " + ap; }
  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function expiryOf(d) { var e = startOfDay(d); e.setDate(e.getDate() + 60); return e; }
  function daysLeft(exp) { return Math.round((exp - startOfDay(new Date())) / 86400000); }
  function effectiveStatus(r) {
    var left = daysLeft(expiryOf(new Date(r.requested)));
    return (r.status === "pending" && left <= 0) ? "expired" : r.status;
  }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  /* ---- state ---- */
  var state = { list: DATA.slice(), tab: "all", q: "" };
  var lastDeleted = null, toastTimer, pendingDelete = null;

  function visible() {
    var q = state.q.trim().toLowerCase();
    return state.list.filter(function (r) {
      var st = effectiveStatus(r);
      if (state.tab !== "all" && st !== state.tab) return false;
      if (q && (r.name + " " + r.city + " " + r.address).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
  }

  function renderTabs() {
    var counts = { all: state.list.length, pending: 0, approved: 0, rejected: 0, expired: 0 };
    state.list.forEach(function (r) { counts[effectiveStatus(r)]++; });
    $("tabs").innerHTML = TABS.filter(function (t) { return t[0] !== "expired" || counts.expired > 0 || state.tab === "expired"; }).map(function (t) {
      return '<button type="button" role="tab" class="tab t-' + t[0] + (state.tab === t[0] ? " on" : "") + '" data-tab="' + t[0] + '" aria-selected="' + (state.tab === t[0]) + '">' + t[1] + '<span class="n">' + counts[t[0]] + "</span></button>";
    }).join("");
  }

  function card(r) {
    var st = effectiveStatus(r), S = STATUS[st];
    var req = new Date(r.requested), exp = expiryOf(req), left = daysLeft(exp);
    var expExtra = "";
    if (st === "pending") {
      var used = Math.max(0, Math.min(100, Math.round(left / 60 * 100)));
      var urg = left <= 10;
      expExtra = '<div class="meter' + (urg ? " urgent" : "") + '" role="img" aria-label="' + left + ' of 60 days left"><i style="width:' + used + '%"></i></div><span class="sub ' + (urg ? "urgent" : "warn") + '">' + left + (left === 1 ? " day left" : " days left") + "</span>";
    } else if (st === "expired") expExtra = '<span class="sub">Expired</span>';
    var prods = r.products.map(function (k) {
      var p = PRODUCTS[k];
      return '<div class="prod ' + p.cls + '"><span class="pi">' + img(p.file, 20, p.fb) + "</span><strong>" + p.name + "</strong></div>";
    }).join("");
    var remark = st === "rejected" ?
      '<div class="remark"><span class="ri">' + I(ICON.note, 15) + '</span><div><span class="k">Remark from institution</span><p>' + esc(r.remark || "The institution did not add a remark.") + "</p></div></div>" : "";
    var del = (st === "approved" || st === "rejected") ? "" : '<button type="button" class="btn btn-danger-soft" data-del="' + r.id + '">' + I(ICON.trash, 15) + "Delete request</button>";
    return '<article class="card req" data-id="' + r.id + '">' +
      '<div class="rq-head">' +
        '<div class="rq-id"><div class="logo-tile tone-' + r.tone + '">' + img("icon", 32, "inst") + "</div><div>" +
          '<h3 class="rq-name">' + esc(r.name) + "</h3>" +
          '<div class="rq-meta"><span>' + I(ICON.pin, 14) + esc(r.address) + '</span><a href="https://' + esc(r.website) + '" target="_blank" rel="noopener">' + I(ICON.globe, 14) + esc(r.website) + "</a></div>" +
        "</div></div>" +
        '<div class="rq-side"><span class="status st-' + st + '">' + I(ICON[S.icon], 16) + S.label + "</span>" + del + "</div>" +
      "</div>" +
      '<div class="rq-body">' +
        '<div class="col"><span class="k">Profile</span><div class="val"><span class="profile-pill">' + I(ICON.user, 15) + esc(r.profile) + "</span></div></div>" +
        '<div class="col"><span class="k">Requested on</span><div class="val">' + fmtDate(req) + "</div></div>" +
        '<div class="col col-exp"><span class="k">Expires on</span><div class="val">' + fmtDate(exp) + "</div>" + expExtra + "</div>" +
        '<div class="col col-prod"><span class="k">Products requested<span class="cnt">' + r.products.length + '</span></span><div class="prods">' + prods + "</div></div>" +
      "</div>" + remark +
    "</article>";
  }

  function render() {
    renderTabs();
    var list = visible();
    $("grid").innerHTML = list.map(card).join("");
    $("grid").hidden = list.length === 0;
    var empty = $("empty");
    empty.hidden = list.length > 0;
    if (!list.length) {
      if (!state.list.length) {
        empty.innerHTML = '<div class="e-ico">' + I(ICON.send, 28) + '</div><h3>No join requests yet</h3><p>Requests you send to institutions will show up here, so you can track each one.</p>';
      } else {
        empty.innerHTML = '<div class="e-ico">' + I(ICON.search, 28) + '</div><h3>No requests found</h3><p>Nothing matches your search or filter. Try another institution name or show all statuses.</p><button type="button" class="btn btn-primary" id="resetBtn">Show all requests</button>';
      }
    }
    $("countLine").textContent = list.length ? "Showing " + list.length + " of " + state.list.length + (state.list.length === 1 ? " request" : " requests") : "";
    $("qClear").hidden = !state.q;
  }

  /* ---- events ---- */
  $("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-tab]"); if (!b) return;
    state.tab = b.getAttribute("data-tab"); render();
  });
  $("q").addEventListener("input", function () { state.q = $("q").value; render(); });
  $("qClear").addEventListener("click", function () { $("q").value = ""; state.q = ""; render(); $("q").focus(); });
  $("empty").addEventListener("click", function (e) {
    if (e.target.id === "resetBtn") { state.tab = "all"; state.q = ""; $("q").value = ""; render(); }
  });

  var opener = null;
  $("grid").addEventListener("click", function (e) {
    var b = e.target.closest("[data-del]"); if (!b) return;
    var id = +b.getAttribute("data-del");
    pendingDelete = state.list.filter(function (r) { return r.id === id; })[0];
    if (!pendingDelete) return;
    opener = b;
    $("mWho").innerHTML = esc(pendingDelete.name) + "<small>" + pendingDelete.products.map(function (k) { return PRODUCTS[k].name; }).join(", ") + " &middot; " + esc(pendingDelete.profile) + " &middot; " + fmtDate(new Date(pendingDelete.requested)) + "</small>";
    $("overlay").hidden = false;
    $("mCancel").focus();
  });
  function closeModal() { $("overlay").hidden = true; pendingDelete = null; if (opener) { try { opener.focus(); } catch (e) {} } }
  $("mCancel").addEventListener("click", closeModal);
  $("overlay").addEventListener("click", function (e) { if (e.target === $("overlay")) closeModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("overlay").hidden) closeModal(); });

  $("mOk").addEventListener("click", function () {
    var r = pendingDelete; if (!r) return;
    var idx = state.list.indexOf(r);
    $("overlay").hidden = true; pendingDelete = null;
    var el = $("grid").querySelector('[data-id="' + r.id + '"]');
    function finish() {
      state.list.splice(idx, 1); lastDeleted = { item: r, index: idx }; render();
      toast("Request deleted", r.name);
    }
    if (el) { el.classList.add("leaving"); setTimeout(finish, 220); } else finish();
  });
  function toast(title, body) {
    $("tTitle").textContent = title; $("tBody").textContent = body;
    var t = $("toast"); t.classList.add("show"); clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); lastDeleted = null; }, 6000);
  }
  $("tUndo").addEventListener("click", function () {
    if (!lastDeleted) return;
    state.list.splice(Math.min(lastDeleted.index, state.list.length), 0, lastDeleted.item);
    lastDeleted = null; $("toast").classList.remove("show"); render();
  });

  render();
})();
</script>
</body>
</html>
