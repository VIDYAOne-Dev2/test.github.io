<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Class & Shift Configuration</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Premium SaaS Color Palette */
  --bg-app: #F7F8FA;
  --bg-card: #FFFFFF;
  --bg-subtle: #F1F5F9;
  --bg-hover: #F8FAFC;

  --border-light: #E7EAEF;
  --border-focus: #CBD5E1;

  --text-main: #0F172A;
  --text-secondary: #475569;
  --text-tertiary: #64748B;

  --primary: #0F172A;
  --primary-hover: #1E293B;
  --accent: #2563EB;
  --accent-soft: #EFF6FF;
  --accent-border: #BFDBFE;

  --success-bg: #ECFDF5;
  --success-text: #065F46;
  --success-border: #A7F3D0;
  --success-solid: #10B981;

  --danger-bg: #FEF2F2;
  --danger-text: #991B1B;

  /* Refined, slightly cool-tinted shadows for depth without heaviness */
  --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04), 0 4px 10px -4px rgba(15, 23, 42, 0.07);
  --shadow-md: 0 6px 16px -6px rgba(15, 23, 42, 0.12), 0 2px 6px -2px rgba(15, 23, 42, 0.06);
  --shadow-dropdown: 0 16px 32px -8px rgba(15, 23, 42, 0.14), 0 4px 10px -4px rgba(15, 23, 42, 0.06);

  --radius-xl: 16px;
  --radius-lg: 12px;
  --radius-md: 8px;
  --radius-sm: 6px;

  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background:
    radial-gradient(1100px 480px at 12% -10%, rgba(37, 99, 235, 0.07), transparent 60%),
    radial-gradient(900px 420px at 100% 0%, rgba(16, 185, 129, 0.05), transparent 55%),
    var(--bg-app);
  background-attachment: fixed;
  color: var(--text-main);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 13px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body::before {
  content: ''; position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 200;
  background: linear-gradient(90deg, #0F172A 0%, var(--accent) 45%, var(--success-solid) 100%);
}
button { font: inherit; outline: none; border: none; cursor: pointer; background: transparent; }
button:focus-visible,
.select-trigger:focus-visible,
.toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-sm); }

.container { max-width: 1360px; margin: 0 auto; padding: 40px 32px 80px; }

/* Header Area */
.page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--border-light); }
.header-left { display: flex; align-items: center; gap: 14px; }
.header-mark {
  width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
  background: linear-gradient(145deg, #1E293B, #0F172A);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 14px -4px rgba(15, 23, 42, 0.35);
}
.header-mark svg { width: 20px; height: 20px; color: #A7F3D0; }
.header-title h1 { font-size: 25px; font-weight: 700; color: var(--text-main); letter-spacing: -0.03em; margin-bottom: 4px; }
.header-title p { color: var(--text-secondary); font-size: 14px; }

/* Session Dropdown */
.session-selector { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.label-sm { font-size: 11px; font-weight: 700; color: var(--text-tertiary); letter-spacing: 0.06em; text-transform: uppercase; }
.custom-select { position: relative; }
.select-trigger {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  background: var(--bg-card); border: 1px solid var(--border-light);
  padding: 10px 16px; border-radius: 999px; box-shadow: var(--shadow-xs);
  font-weight: 700; color: var(--text-main); min-width: 168px; transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease), transform 0.2s var(--ease);
}
.select-trigger:hover { border-color: var(--accent-border); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.select-trigger svg { color: var(--text-tertiary); transition: transform 0.2s var(--ease); }
.dropdown-wrapper.open .select-trigger svg { transform: rotate(180deg); color: var(--text-main); }

/* Grid & Cards */
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; align-items: start; }
.card {
  position: relative; z-index: 1;
  background: var(--bg-card); border: 1px solid var(--border-light);
  border-radius: var(--radius-xl); box-shadow: var(--shadow-sm);
  display: flex; flex-direction: column;
  transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease), transform 0.2s var(--ease);
}
.card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  background: linear-gradient(90deg, #94A3B8, #CBD5E1);
}
.card:hover { border-color: var(--border-focus); box-shadow: var(--shadow-md); transform: translateY(-2px); }
.card.senior { grid-column: 1 / -1; border-color: var(--accent-border); }
.card.senior::before { background: linear-gradient(90deg, var(--accent), #60A5FA); height: 4px; }
.card.senior:hover { transform: none; }
.card.disabled { opacity: 0.6; background: #FAFBFC; }
.card.disabled::before { background: var(--border-light); }
.card.disabled:hover { transform: none; box-shadow: var(--shadow-sm); border-color: var(--border-light); }
.card.disabled .card-body { pointer-events: none; }
.card.disabled .card-title { color: var(--text-tertiary); }

/* Card Header */
.card-header {
  padding: 15px 18px 14px; border-bottom: 1px solid var(--border-light);
  display: flex; align-items: center; gap: 12px; background: #FFFFFF;
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
}
.card.senior .card-header { background: linear-gradient(180deg, #F5F9FF 0%, #FFFFFF 100%); }
.card-title { font-size: 15px; font-weight: 700; color: var(--text-main); flex-grow: 1; letter-spacing: -0.01em; }
.card-actions { display: flex; align-items: center; gap: 10px; }

/* Badges */
.badge {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 8px;
  border-radius: 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
}
.badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.badge-active { background: var(--success-bg); color: var(--success-text); box-shadow: inset 0 0 0 1px var(--success-border); }
.badge-active::before { background: var(--success-solid); }
.badge-inactive { background: var(--bg-subtle); color: var(--text-tertiary); box-shadow: inset 0 0 0 1px var(--border-light); }
.badge-inactive::before { background: var(--text-tertiary); }

/* iOS-style Toggle */
.toggle {
  width: 34px; height: 20px; border-radius: 20px; background: #CBD5E1;
  padding: 2px; transition: background 0.2s var(--ease); position: relative; flex-shrink: 0;
}
.toggle:hover { background: #B6C1D1; }
.toggle.on { background: var(--success-solid); }
.toggle.on:hover { background: #0EA671; }
.toggle span {
  display: block; width: 16px; height: 16px; border-radius: 50%; background: #FFF;
  box-shadow: 0 1px 2px rgba(0,0,0,0.2); transition: transform 0.2s var(--ease);
}
.toggle.on span { transform: translateX(14px); }

/* Card Body (Adjusted Spacing) */
.card-body { padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.field-group { display: flex; flex-direction: column; gap: 8px; }
.field-label { font-size: 12px; font-weight: 600; color: var(--text-tertiary); display: flex; align-items: center; gap: 6px; }

/* Segmented Control */
.segmented {
  display: inline-flex; background: var(--bg-subtle); padding: 3px;
  border-radius: var(--radius-md); border: 1px solid var(--border-light); width: fit-content;
}
.seg-btn {
  padding: 4px 12px; font-size: 12px; font-weight: 500; color: var(--text-secondary);
  border-radius: var(--radius-sm); transition: color 0.15s var(--ease), background 0.15s var(--ease), box-shadow 0.15s var(--ease);
}
.seg-btn.active { background: #DCFCE7; color: #166534; font-weight: 700; box-shadow: inset 0 0 0 1px #A7F3D0; }
.seg-btn:hover:not(.active) { color: var(--text-main); }

/* Pill Lists */
.pill-list { display: flex; flex-wrap: wrap; gap: 10px 8px; align-items: center; margin-top: 2px; }
.pill {
  position: relative;
  display: inline-flex; align-items: center; height: 27px; padding: 0 12px;
  border-radius: 14px; font-size: 12px; font-weight: 600;
  background: var(--bg-subtle); color: var(--text-secondary);
  box-shadow: inset 0 0 0 1px var(--border-light);
  transition: background 0.15s var(--ease), box-shadow 0.15s var(--ease);
}

/* Elegant Color Coded Pills (No borders, soft backgrounds) */
.pill.red { background: #FEF2F2; color: #991B1B; box-shadow: inset 0 0 0 1px #FECACA; }
.pill.green { background: #F0FDF4; color: #166534; box-shadow: inset 0 0 0 1px #BBF7D0; }
.pill.blue { background: #EFF6FF; color: #1E40AF; box-shadow: inset 0 0 0 1px #BFDBFE; }
.pill.yellow { background: #FEFCE8; color: #854D0E; box-shadow: inset 0 0 0 1px #FEF08A; }

/* Small remove control pinned to the top-right corner of a pill */
.pill-remove {
  position: absolute; top: -6px; right: -6px; width: 16px; height: 16px; z-index: 2;
  border-radius: 50%; background: #FFFFFF; color: var(--text-tertiary);
  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.22), inset 0 0 0 1px var(--border-light);
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s var(--ease), color 0.15s var(--ease), transform 0.15s var(--ease);
}
.pill-remove svg { width: 8px; height: 8px; }
.pill-remove:hover { background: var(--danger-bg); color: var(--danger-text); transform: scale(1.12); }

/* Dropdown Wrapper & Add Buttons */
.dropdown-wrapper { position: relative; display: inline-block; }
.btn-add {
  display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px;
  border-radius: 14px; font-size: 12px; font-weight: 600; color: var(--text-tertiary);
  border: 1px dashed var(--border-focus); transition: border-color 0.2s var(--ease), background 0.2s var(--ease), color 0.2s var(--ease); background: transparent;
}
.btn-add:hover, .dropdown-wrapper.open .btn-add {
  border-style: solid; border-color: var(--border-focus); background: var(--bg-subtle); color: var(--text-main);
}
.btn-add svg { width: 12px; height: 12px; }

/* Enhanced "+ Add Stream" Button */
.btn-add-stream {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
  border-radius: var(--radius-md); font-size: 12px; font-weight: 600;
  background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-border);
  transition: background 0.2s var(--ease), border-color 0.2s var(--ease), transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
  box-shadow: var(--shadow-xs);
}
.btn-add-stream:hover, .dropdown-wrapper.open .btn-add-stream {
  background: #DBEAFE; border-color: #93C5FD; transform: translateY(-1px); box-shadow: var(--shadow-sm);
}
.btn-add-stream svg { width: 14px; height: 14px; stroke-width: 2.5px; }

/* Dropdown Menu */
.dropdown-menu {
  position: absolute; left: 0; top: calc(100% + 6px); z-index: 50;
  background: var(--bg-card); border: 1px solid var(--border-light);
  border-radius: var(--radius-md); box-shadow: var(--shadow-dropdown);
  min-width: 150px; max-height: 240px; overflow-y: auto;
  padding: 6px; display: none; flex-direction: column;
}
.dropdown-wrapper.right .dropdown-menu { left: auto; right: 0; }
.dropdown-wrapper.open .dropdown-menu { display: flex; animation: slideDown 0.15s var(--ease) forwards; transform-origin: top; }
@keyframes slideDown { from { opacity: 0; transform: translateY(-4px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

.dropdown-item {
  padding: 7px 10px; font-size: 12px; font-weight: 500; color: var(--text-secondary);
  border-radius: 4px; text-align: left; transition: background 0.1s, color 0.1s;
}
.dropdown-item:hover { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.dropdown-empty { padding: 10px 8px; font-size: 12px; color: var(--text-tertiary); text-align: center; font-style: italic; }

/* Senior Classes Layout */
.stream-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stream-card {
  position: relative; z-index: 1;
  background: #FBFBFA; border: 1px solid var(--border-light); border-left: 3px solid var(--border-light);
  border-radius: var(--radius-md); padding: 14px;
  display: flex; flex-direction: column; gap: 12px;
  transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease), transform 0.2s var(--ease);
}
.stream-card:hover { border-color: var(--border-focus); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.stream-card.stream-science { border-left-color: #3B82F6; }
.stream-card.stream-commerce { border-left-color: #10B981; }
.stream-card.stream-arts { border-left-color: #8B5CF6; }
.stream-card.stream-humanities { border-left-color: #F59E0B; }
.stream-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-light); padding-bottom: 8px; }
.stream-name { font-size: 13px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 8px; }

/* Colored dot indicator for streams (kept for inline use) */
.stream-color-line { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.color-science { background: #3B82F6; }
.color-commerce { background: #10B981; }
.color-arts { background: #8B5CF6; }
.color-humanities { background: #F59E0B; }

.btn-remove {
  font-size: 11px; font-weight: 600; color: var(--text-tertiary);
  transition: color 0.2s var(--ease), background 0.2s var(--ease); padding: 4px 8px; border-radius: 4px;
}
.btn-remove:hover { color: var(--danger-text); background: var(--danger-bg); }

/* Global Actions Bar */
.page-actions {
  margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--border-light);
  display: flex; justify-content: flex-end; gap: 12px;
}
.btn {
  display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px;
  border-radius: var(--radius-md); font-size: 13px; font-weight: 600;
  transition: background 0.2s var(--ease), border-color 0.2s var(--ease), box-shadow 0.2s var(--ease), transform 0.2s var(--ease);
  box-shadow: var(--shadow-xs);
}
.btn:active { transform: translateY(1px); }
.btn-outline { background: var(--bg-card); border: 1px solid var(--border-focus); color: var(--text-secondary); }
.btn-outline:hover { background: var(--bg-subtle); color: var(--text-main); border-color: #94A3B8; }
.btn-primary { background: linear-gradient(180deg, #1E293B, #0F172A); border: 1px solid #0F172A; color: #FFF; box-shadow: 0 4px 10px -3px rgba(15, 23, 42, 0.4); }
.btn-primary:hover { background: linear-gradient(180deg, #29394F, #172136); box-shadow: 0 6px 14px -3px rgba(15, 23, 42, 0.45); }

/* Toast Notification */
.toast {
  position: fixed; bottom: 32px; right: 32px; z-index: 100;
  background: var(--text-main); color: #FFF; padding: 12px 16px;
  border-radius: var(--radius-md); box-shadow: var(--shadow-dropdown);
  display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 13px;
  opacity: 0; transform: translateY(16px) scale(0.98); pointer-events: none; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.toast.show { opacity: 1; transform: translateY(0) scale(1); }

/* Responsive Grid: 3-up on large monitors, 2-up on small laptops/tablets, 1-up on phones */
@media (max-width: 1200px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 992px) {
  .stream-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .grid, .stream-grid { grid-template-columns: 1fr; }
  .container { padding: 20px 16px 64px; }
  .page-header { flex-direction: column; gap: 16px; align-items: flex-start; }
  .session-selector { align-items: flex-start; width: 100%; }
  .select-trigger { width: 100%; }
  .page-actions { flex-direction: column-reverse; }
  .btn { width: 100%; justify-content: center; }
  .toast { left: 16px; right: 16px; bottom: 16px; }
}
</style>
</head>
<body>

<div class="container">
  
  <header class="page-header">
    <div class="header-left">
      <div class="header-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5-10-5z"></path><path d="M6 12v5c0 1 3 3 6 3s6-2 6-3v-5"></path></svg>
      </div>
      <div class="header-title">
        <h1>Class &amp; Shift Setup</h1>
        <p>Configure classes, sections, houses, and streams for the academic year.</p>
      </div>
    </div>

    <div class="session-selector">
      <span class="label-sm">Academic Session</span>
      <div class="dropdown-wrapper right">
        <button class="select-trigger" onclick="toggleDropdown(this)">
          <span id="sessionValue">2025–2026</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
        <div class="dropdown-menu">
          <button class="dropdown-item" onclick="setSession('2025–2026')">2025–2026</button>
          <button class="dropdown-item" onclick="setSession('2026–2027')">2026–2027</button>
          <button class="dropdown-item" onclick="setSession('2027–2028')">2027–2028</button>
        </div>
      </div>
    </div>
  </header>

  <main class="grid" id="classGrid"></main>

  <footer class="page-actions">
    <button class="btn btn-outline" onclick="resetDemo()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
      Discard Changes
    </button>
    <button class="btn btn-primary" onclick="save()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
      Save Structure
    </button>
  </footer>
</div>

<div class="toast" id="toast">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A7F3D0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
  Changes saved successfully
</div>

<script>
// Master Data
const masterSections = ['Section A','Section B','Section C','Section D','Section E'];
const masterHouses = ['Red House','Green House','Blue House','Yellow House'];
const masterStreams = ['Science','Commerce','Humanities','Arts'];

// Initial State Data
const normalClasses = [
  { name: 'Nursery', sections: ['Section A','Section B'] },
  { name: 'LKG', sections: ['Section A','Section B'] },
  { name: 'UKG', sections: ['Section A','Section B'] },
  { name: 'Class 1', sections: ['Section A','Section B','Section C'] },
  { name: 'Class 2', sections: ['Section A','Section B','Section C'] },
  { name: 'Class 3', sections: ['Section A','Section B','Section C'] },
  { name: 'Class 4', sections: ['Section A','Section B','Section C'] },
  { name: 'Class 5', sections: ['Section A','Section B','Section C'] },
  { name: 'Class 6', sections: ['Section A','Section B'] },
  { name: 'Class 7', sections: ['Section A','Section B'] },
  { name: 'Class 8', sections: ['Section A','Section B'] },
  { name: 'Class 9', sections: ['Section A','Section B','Section C'] },
  { name: 'Class 10', sections: ['Section A','Section B','Section C'] }
];

const seniorClasses = {
  'Class 11': {
    streams:[
      {name:'Science', shifts:['Morning'], sections:['Section A','Section B'], houses:['Red House','Green House']},
      {name:'Commerce', shifts:['Morning'], sections:['Section A'], houses:['Red House','Blue House']}
    ]
  },
  'Class 12': {
    streams:[
      {name:'Science', shifts:['Morning'], sections:['Section A','Section B'], houses:['Red House','Green House']},
      {name:'Commerce', shifts:['Morning'], sections:['Section A'], houses:['Red House']}
    ]
  }
};

let enabled = {};
let classHouses = {};
let classShifts = {};

// Populate defaults
normalClasses.forEach(cls => {
  enabled[cls.name] = true;
  classHouses[cls.name] = ['Red House', 'Green House'];
  classShifts[cls.name] = ['Morning'];
});
enabled['Class 11'] = true;
enabled['Class 12'] = true;

// Event Listeners for Dropdowns
document.addEventListener('click', (e) => {
  if (!e.target.closest('.dropdown-wrapper')) {
    closeAllDropdowns();
  }
});

function closeAllDropdowns() {
  document.querySelectorAll('.dropdown-wrapper.open').forEach(el => {
    el.classList.remove('open');
    const card = el.closest('.card');
    if (card) card.style.zIndex = '';
    const streamCard = el.closest('.stream-card');
    if (streamCard) streamCard.style.zIndex = '';
  });
}

function toggleDropdown(btn) {
  const wrapper = btn.closest('.dropdown-wrapper');
  const isOpen = wrapper.classList.contains('open');
  closeAllDropdowns();
  if (!isOpen) {
    wrapper.classList.add('open');
    // Lift the card above sibling cards so the dropdown never renders underneath the next row
    const card = wrapper.closest('.card');
    if (card) card.style.zIndex = '50';
    const streamCard = wrapper.closest('.stream-card');
    if (streamCard) streamCard.style.zIndex = '30';
  }
}

function setSession(val) {
  document.getElementById('sessionValue').textContent = val;
  closeAllDropdowns();
}

function toggleClass(name) {
  enabled[name] = !enabled[name];
  render();
}

// Icons & Styling Helpers
const iconPlus = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>`;
const iconX = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;

function getPillClass(text) {
  const t = text.toLowerCase();
  if (t.includes('red')) return 'red';
  if (t.includes('green')) return 'green';
  if (t.includes('blue')) return 'blue';
  if (t.includes('yellow')) return 'yellow';
  return '';
}

function getStreamColorClass(name) {
  const t = name.toLowerCase();
  if (t.includes('science')) return 'color-science';
  if (t.includes('commerce')) return 'color-commerce';
  if (t.includes('humanities')) return 'color-humanities';
  if (t.includes('arts')) return 'color-arts';
  return '';
}

// State Mutation Actions
function addSection(className, section, streamIndex = null) {
  if(streamIndex === null) {
    const cls = normalClasses.find(x => x.name === className);
    if (!cls.sections.includes(section)) cls.sections.push(section);
    cls.sections.sort();
  } else {
    const s = seniorClasses[className].streams[streamIndex];
    if (!s.sections.includes(section)) s.sections.push(section);
    s.sections.sort();
  }
  render();
}

function removeSection(className, section, streamIndex = null) {
  if (streamIndex === null) {
    const cls = normalClasses.find(x => x.name === className);
    cls.sections = cls.sections.filter(s => s !== section);
  } else {
    const s = seniorClasses[className].streams[streamIndex];
    s.sections = s.sections.filter(x => x !== section);
  }
  render();
}

function removeHouse(className, house, streamIndex = null) {
  if (streamIndex === null) {
    classHouses[className] = classHouses[className].filter(h => h !== house);
  } else {
    const s = seniorClasses[className].streams[streamIndex];
    s.houses = s.houses.filter(x => x !== house);
  }
  render();
}

function addHouse(className, house, streamIndex = null) {
  if(streamIndex === null) {
    if (!classHouses[className].includes(house)) classHouses[className].push(house);
  } else {
    const s = seniorClasses[className].streams[streamIndex];
    if (!s.houses.includes(house)) s.houses.push(house);
  }
  render();
}

function addStream(className, streamName) {
  seniorClasses[className].streams.push({ name: streamName, shifts: ['Morning'], sections: ['Section A'], houses: ['Red House']});
  render();
}

function removeStream(className, i) {
  seniorClasses[className].streams.splice(i, 1);
  render();
}

function selectShift(className, streamIndex, shift) {
  const arr = streamIndex === null ? classShifts[className] : seniorClasses[className].streams[streamIndex].shifts;
  const idx = arr.indexOf(shift);
  if (idx === -1) arr.push(shift);
  else arr.splice(idx, 1);
  if (arr.length === 0) arr.push('Morning');
  render();
}

// Utility: Build Dropdown Items
function generateDropdown(options, onClickStr) {
  if (options.length === 0) return `<div class="dropdown-empty">All options added</div>`;
  return options.map(opt => `<button class="dropdown-item" onclick="${onClickStr.replace('__VAL__', opt)}">${opt}</button>`).join('');
}

// UI Renderers
function renderNormal(cls) {
  const name = cls.name;
  const sections = cls.sections;
  const houses = classHouses[name];
  const isActive = enabled[name];
  
  const availSections = masterSections.filter(s => !sections.includes(s));
  const availHouses = masterHouses.filter(h => !houses.includes(h));

  return `
  <div class="card ${!isActive ? 'disabled' : ''}">
    <div class="card-header">
      <button class="toggle ${isActive ? 'on' : ''}" onclick="toggleClass('${name}')"><span></span></button>
      <div class="card-title">${name}</div>
      <div class="card-actions">
        <span class="badge ${isActive ? 'badge-active' : 'badge-inactive'}">${isActive ? 'Active' : 'Inactive'}</span>
      </div>
    </div>
    <div class="card-body">
      <div class="field-group">
        <div class="field-label">Shifts</div>
        <div class="segmented">
          ${['Morning','Afternoon'].map(x => `
            <button class="seg-btn ${classShifts[name].includes(x) ? 'active' : ''}" onclick="selectShift('${name}', null, '${x}')">${x}</button>
          `).join('')}
        </div>
      </div>
      <div class="field-group">
        <div class="field-label">Sections</div>
        <div class="pill-list">
          ${sections.map(s => `<span class="pill">${s}<button class="pill-remove" onclick="event.stopPropagation(); removeSection('${name}', '${s}')" aria-label="Remove ${s}">${iconX}</button></span>`).join('')}
          <div class="dropdown-wrapper">
            <button class="btn-add" onclick="toggleDropdown(this)">${iconPlus} Add</button>
            <div class="dropdown-menu">
              ${generateDropdown(availSections, `addSection('${name}', '__VAL__')`)}
            </div>
          </div>
        </div>
      </div>
      <div class="field-group">
        <div class="field-label">Houses</div>
        <div class="pill-list">
          ${houses.map(h => `<span class="pill ${getPillClass(h)}">${h}<button class="pill-remove" onclick="event.stopPropagation(); removeHouse('${name}', '${h}')" aria-label="Remove ${h}">${iconX}</button></span>`).join('')}
          <div class="dropdown-wrapper">
            <button class="btn-add" onclick="toggleDropdown(this)">${iconPlus} Add</button>
            <div class="dropdown-menu">
              ${generateDropdown(availHouses, `addHouse('${name}', '__VAL__')`)}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function renderSenior(name) {
  const d = seniorClasses[name];
  const isActive = enabled[name];
  const activeStreams = d.streams.map(s => s.name);
  const availStreams = masterStreams.filter(s => !activeStreams.includes(s));

  return `
  <div class="card senior ${!isActive ? 'disabled' : ''}">
    <div class="card-header">
      <button class="toggle ${isActive ? 'on' : ''}" onclick="toggleClass('${name}')"><span></span></button>
      <div class="card-title">${name}</div>
      <div class="card-actions">
        <span class="badge ${isActive ? 'badge-active' : 'badge-inactive'}">${isActive ? 'Active' : 'Inactive'}</span>
        
        <div class="dropdown-wrapper right">
          <button class="btn-add-stream" onclick="toggleDropdown(this)">
            ${iconPlus} Add Stream
          </button>
          <div class="dropdown-menu">
            ${generateDropdown(availStreams, `addStream('${name}', '__VAL__')`)}
          </div>
        </div>

      </div>
    </div>
    
    <div class="card-body">
      <div class="stream-grid">
        ${d.streams.map((s, i) => {
          const availSecs = masterSections.filter(x => !s.sections.includes(x));
          const availHs = masterHouses.filter(x => !s.houses.includes(x));
          
          return `
          <div class="stream-card ${getStreamColorClass(s.name).replace('color-', 'stream-')}">
            <div class="stream-head">
              <div class="stream-name">
                <div class="stream-color-line ${getStreamColorClass(s.name)}"></div>
                ${s.name}
              </div>
              <button class="btn-remove" onclick="removeStream('${name}', ${i})">Remove</button>
            </div>
            
            <div class="field-group">
              <div class="field-label">Shifts</div>
              <div class="segmented">
                ${['Morning','Evening'].map(x => `
                  <button class="seg-btn ${s.shifts.includes(x) ? 'active' : ''}" onclick="selectShift('${name}', ${i}, '${x}')">${x}</button>
                `).join('')}
              </div>
            </div>
            
            <div class="field-group">
              <div class="field-label">Sections</div>
              <div class="pill-list">
                ${s.sections.map(sec => `<span class="pill">${sec}<button class="pill-remove" onclick="event.stopPropagation(); removeSection('${name}', '${sec}', ${i})" aria-label="Remove ${sec}">${iconX}</button></span>`).join('')}
                <div class="dropdown-wrapper">
                  <button class="btn-add" onclick="toggleDropdown(this)">${iconPlus} Add</button>
                  <div class="dropdown-menu">
                    ${generateDropdown(availSecs, `addSection('${name}', '__VAL__', ${i})`)}
                  </div>
                </div>
              </div>
            </div>
            
            <div class="field-group">
              <div class="field-label">Houses</div>
              <div class="pill-list">
                ${s.houses.map(h => `<span class="pill ${getPillClass(h)}">${h}<button class="pill-remove" onclick="event.stopPropagation(); removeHouse('${name}', '${h}', ${i})" aria-label="Remove ${h}">${iconX}</button></span>`).join('')}
                <div class="dropdown-wrapper">
                  <button class="btn-add" onclick="toggleDropdown(this)">${iconPlus} Add</button>
                  <div class="dropdown-menu">
                    ${generateDropdown(availHs, `addHouse('${name}', '__VAL__', ${i})`)}
                  </div>
                </div>
              </div>
            </div>
          </div>`
        }).join('')}
        
        ${d.streams.length === 0 ? `<div style="grid-column: 1/-1; padding: 16px; text-align: center; color: var(--text-tertiary); font-style: italic; border: 1px dashed var(--border-light); border-radius: var(--radius-md);">No streams configured. Click "Add Stream" to begin.</div>` : ''}
      </div>
    </div>
  </div>`;
}

function render() {
  document.getElementById('classGrid').innerHTML =
    normalClasses.map(cls => renderNormal(cls)).join('') +
    renderSenior('Class 11') + 
    renderSenior('Class 12');
}

function save() {
  const t = document.getElementById('toast'); 
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function resetDemo() { location.reload(); }

// Init
render();
</script>
</body>
</html>
