<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website Publish History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #14173d;
  --ink-soft: #5b6188;
  --line: #e6eaf2;
  --green: #16a34a;
  --green-deep: #12803c;
  --green-tint: #eaf7ee;
  --green-line: #bfe6cb;
  --blue: #2f6fe4;
  --blue-deep: #1f55b8;
  --blue-tint: #e8f1ff;
  --blue-line: #c9dcfb;
  --yellow: #a8670a;
  --yellow-tint: #fff6dc;
  --yellow-line: #f1dd9c;
  --rose: #c8323f;
  --rose-tint: #fdecee;
  --rose-line: #f6c9ce;
  --slate: #56607f;
  --slate-tint: #eef1f7;
  --slate-line: #d9dfeb;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --shadow: 0 1px 2px rgba(20,23,61,.04), 0 12px 32px -14px rgba(20,23,61,.12);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); color: var(--ink); background: #fff; line-height: 1.45; -webkit-font-smoothing: antialiased; min-height: 100vh; padding: 32px 20px 64px; }
[hidden] { display: none !important; }
button, select { font: inherit; color: inherit; }
svg { display: block; flex: none; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid rgba(22,163,74,.35); outline-offset: 2px; }
.app { width: 100%; max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

.page-head { display: flex; align-items: center; gap: 14px; padding: 2px; flex-wrap: wrap; }
.ph-ico { width: 48px; height: 48px; border-radius: 15px; background: var(--green-tint); color: var(--green-deep); display: grid; place-items: center; border: 1px solid var(--green-line); }
.page-head h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
.grow { flex: 1; }
.total { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 10px; border-radius: 12px; background: var(--green-tint); border: 1px solid var(--green-line); color: var(--green-deep); font-size: 13.5px; font-weight: 700; }
.total b { font-size: 17px; font-weight: 800; }

.retain { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; background: var(--blue-tint); border: 1px solid var(--blue-line); font-size: 13.5px; color: #1b3f86; font-weight: 500; }
.retain b { font-weight: 800; }
.retain .ri { width: 30px; height: 30px; border-radius: 10px; background: #fff; border: 1px solid var(--blue-line); color: var(--blue); display: grid; place-items: center; flex: none; }

.live { position: relative; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 18px 20px; border-radius: 22px; border: 1px solid var(--green-line); background: linear-gradient(135deg, #f3fbf6 0%, #ffffff 62%); box-shadow: var(--shadow); overflow: hidden; }
.live::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #3cc16f, #16a34a); }
.live-l { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1 1 320px; }
.live-l .prev { width: 64px; height: 52px; }
.live-kicker { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.live-name { display: inline-flex; align-items: center; gap: 6px; font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
.live-name:hover { color: var(--blue); }
.live-name svg { color: #8c94b3; }
.live-sub { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.live-r { display: flex; align-items: center; gap: 12px; flex: 1 1 280px; justify-content: flex-end; min-width: 0; }
.live-site { text-align: right; min-width: 0; }
.live-site .k { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 2px; }
.live-site a { display: inline-flex; align-items: center; gap: 7px; font-size: 18px; font-weight: 800; color: var(--blue-deep); }
.live-site a:hover { text-decoration: underline; }
.live-site small { display: block; margin-top: 2px; font-size: 12.5px; color: var(--ink-soft); font-weight: 500; }
.live-ico { width: 46px; height: 46px; border-radius: 14px; background: #fff; border: 1px solid var(--green-line); color: var(--green-deep); display: grid; place-items: center; flex: none; }
.live-tag { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px 0 8px; border-radius: 99px; background: var(--green); color: #fff; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.live-tag i { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: pulse 1.8s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.75); } 70% { box-shadow: 0 0 0 6px rgba(255,255,255,0); } 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); } }

.prev { width: 52px; height: 42px; border-radius: 11px; background: var(--tb); border: 1px solid var(--tl); padding: 6px; display: flex; flex-direction: column; gap: 3px; flex: none; }
.prev i { display: block; border-radius: 2px; background: var(--tc); opacity: .85; }
.prev i:nth-child(1) { height: 5px; width: 100%; opacity: 1; }
.prev i:nth-child(2) { height: 11px; width: 100%; opacity: .35; }
.prev .r { display: flex; gap: 3px; flex: 1; }
.prev .r i { flex: 1; height: auto; opacity: .55; }
.tn-green { --tb: var(--green-tint); --tc: var(--green-deep); --tl: var(--green-line); }
.tn-blue { --tb: var(--blue-tint); --tc: var(--blue-deep); --tl: var(--blue-line); }
.tn-yellow { --tb: var(--yellow-tint); --tc: var(--yellow); --tl: var(--yellow-line); }
.tn-rose { --tb: var(--rose-tint); --tc: var(--rose); --tl: var(--rose-line); }

.plan { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px 0 7px; border-radius: 99px; font-size: 11.5px; font-weight: 700; background: var(--pb); color: var(--pc); border: 1px solid var(--pl); white-space: nowrap; }
.plan-free { --pb: var(--green-tint); --pc: var(--green-deep); --pl: var(--green-line); }
.plan-paid { --pb: var(--yellow-tint); --pc: var(--yellow); --pl: var(--yellow-line); }
.code { display: inline-block; font-family: var(--mono); font-size: 11.5px; color: var(--slate); background: var(--slate-tint); border: 1px solid var(--slate-line); border-radius: 6px; padding: 1px 7px; }

.tcard { border: 1px solid var(--line); border-radius: 22px; background: #fff; box-shadow: var(--shadow); overflow: hidden; }
.t-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.t-head h2 { margin: 0; font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.cnt { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 7px; background: var(--slate-tint); color: var(--slate); font-size: 12px; font-weight: 800; }
.sortbtn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-size: 13px; font-weight: 700; cursor: pointer; transition: background .15s; }
.sortbtn:hover { background: #f4f6fb; }
.sortbtn svg { color: var(--green-deep); transition: transform .15s; }
.sortbtn.asc svg { transform: rotate(180deg); }
.twrap { overflow-x: auto; }
.cols, .rec { display: grid; grid-template-columns: 24% 40% 1fr; align-items: center; min-width: 720px; }
.cols { padding: 12px 34px 8px; font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.days { position: relative; display: flex; flex-direction: column; gap: 18px; padding: 18px 16px 18px 48px; min-width: 752px; }
.days::before { content: ""; position: absolute; left: 29px; top: 36px; bottom: 36px; width: 2px; border-radius: 2px; background: linear-gradient(180deg, var(--green-line), var(--slate-line) 30%, var(--slate-line)); }
.day { position: relative; border: 1px solid var(--line); border-radius: 18px; background: #fff; }
.day::before { content: ""; position: absolute; left: -26px; top: 13px; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid #b7bfd6; box-sizing: border-box; z-index: 1; }
.day.today::before { border-color: var(--green); box-shadow: 0 0 0 5px var(--green-tint); }
.g .dot { display: none; }
.dh { border-radius: 17px 17px 0 0; padding: 11px 18px; background: #f6f8fc; border-bottom: 1px solid var(--line); }
.rec { padding: 13px 18px; border-bottom: 1px solid #eef1f7; }
.rec:last-child { border-bottom: 0; border-radius: 0 0 17px 17px; }
.rec:hover { background: #fafbfe; }
.g { display: flex; align-items: center; gap: 10px; font-size: 12.5px; font-weight: 800; letter-spacing: .02em; }
.g .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px var(--green-tint); }
.g .dot.old { background: #b7bfd6; box-shadow: 0 0 0 4px var(--slate-tint); }
.g span.n { font-weight: 600; color: var(--ink-soft); }

.tm { font-size: 15px; font-weight: 800; white-space: nowrap; letter-spacing: -.005em; }
.tm small { font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-left: 2px; }
.rel { font-size: 12.5px; color: var(--ink-soft); font-weight: 500; margin-top: 1px; white-space: nowrap; }

.tpl { display: flex; align-items: center; gap: 12px; min-width: 0; }
.tpl-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tpl-name { display: inline-flex; align-items: center; gap: 6px; font-size: 14.5px; font-weight: 800; }
.tpl-name:hover { color: var(--blue); }
.tpl-name svg { color: #8c94b3; }
.tpl-name:hover svg { color: var(--blue); }
.tpl .code { margin-top: 4px; }

.url { display: flex; align-items: center; gap: 10px; min-width: 0; }
.url .ui { width: 34px; height: 34px; border-radius: 10px; background: var(--slate-tint); color: var(--slate); display: grid; place-items: center; flex: none; }
.url a.u { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--blue-deep); white-space: nowrap; }
.url a.u:hover { text-decoration: underline; }
.url a.u svg { opacity: .7; }
.kind { display: block; margin-top: 1px; font-size: 12px; font-weight: 600; color: var(--ink-soft); }

.tfoot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; border-top: 1px solid var(--line); background: #fafbfe; }
.tfoot .info { font-size: 13px; color: var(--ink-soft); font-weight: 600; }
.tfoot .right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.psize { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink-soft); }
.psize select { height: 32px; border: 1.5px solid var(--line); border-radius: 9px; background: #fff; padding: 0 8px; font-weight: 700; font-size: 13px; cursor: pointer; }
.pager { display: flex; gap: 4px; align-items: center; }
.pager button { min-width: 32px; height: 32px; border-radius: 9px; border: 1px solid transparent; background: transparent; font-size: 13px; font-weight: 700; color: var(--ink-soft); cursor: pointer; display: grid; place-items: center; padding: 0 8px; }
.pager button:hover:not(:disabled) { background: #fff; border-color: var(--line); color: var(--ink); }
.pager button.cur { background: var(--green-tint); color: var(--green-deep); border-color: var(--green-line); }
.pager button:disabled { opacity: .4; cursor: default; }
.pager .dots { color: #98a0bd; font-weight: 700; padding: 0 4px; }

.empty { padding: 56px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }
.empty .e-ico { width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center; background: var(--green-tint); color: var(--green-deep); margin-bottom: 6px; }
.empty h3 { margin: 0; font-size: 18px; font-weight: 800; }
.empty p { margin: 0; font-size: 14px; color: var(--ink-soft); max-width: 46ch; }

@media (max-width: 700px) {
  body { padding: 20px 14px 56px; } .page-head h1 { font-size: 21px; }
  .live-r { justify-content: flex-start; } .live-site { text-align: left; }
  .live-site a { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ===== Polish pass ===== */
body { background: #fff; }
.page-head { padding: 0 2px 2px; gap: 16px; }
.ph-ico { width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(135deg, #3cc16f, #12803c); color: #fff; border: 0; box-shadow: 0 10px 20px -8px rgba(18,128,60,.5); }
.page-head h1 { font-size: 27px; }
.total { height: 38px; padding: 0 16px 0 12px; background: #fff; box-shadow: 0 6px 16px -10px rgba(18,128,60,.5); }
.retain { background: #f6f8fc; border: 1px solid var(--line); color: var(--ink-soft); padding: 9px 14px; font-size: 13px; }
.retain b { color: var(--ink); }
.retain .ri { background: #fff; border-color: var(--line); color: var(--ink-soft); width: 28px; height: 28px; border-radius: 9px; }

.live { padding: 20px 24px 20px 28px; background: linear-gradient(120deg, #eaf8ef 0%, #f6fbff 60%, #fff 100%); }
.live-name { font-size: 20px; margin: 2px 0 2px; }
.live-sub { margin-top: 8px; }
.live-r { gap: 14px; }
.live-site .k { color: var(--green-deep); }
.live-site a { font-size: 19px; }
.live-ico { width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(135deg, #fff, #f2fbf5); box-shadow: 0 8px 18px -10px rgba(18,128,60,.55); }

.tcard { background: #fff; }
.t-head { padding: 16px 22px; }
.t-head h2 { font-size: 16px; }
.cnt { background: var(--green-tint); color: var(--green-deep); }
.sortbtn { height: 36px; padding: 0 14px; border-radius: 11px; }

.days { background: #f8faff; gap: 20px; padding: 22px 22px 22px 54px; border-bottom: 0; }
.days::before { left: 34px; top: 42px; bottom: 42px; background: linear-gradient(180deg, #8fd6a8, #cfd6e6 22%, #cfd6e6); }
.day { border-radius: 18px; border-color: #e3e8f2; box-shadow: 0 1px 2px rgba(20,23,61,.04), 0 8px 20px -14px rgba(20,23,61,.14); }
.day::before { left: -27px; top: 15px; width: 14px; height: 14px; border: 3px solid #b3bcd3; background: #f8faff; }
.day.today::before { border-color: var(--green); background: #fff; box-shadow: 0 0 0 5px rgba(22,163,74,.16); }
.dh { padding: 12px 20px; background: #f3f5fb; }
.day.today .dh { background: var(--green-tint); border-bottom-color: var(--green-line); }
.g { gap: 8px; font-size: 13px; }
.g span.n { color: var(--ink-soft); font-weight: 600; }
.day.today .g { color: var(--green-deep); }
.day.today .g span.n { color: #3f8a5c; }
.rec { grid-template-columns: 21% 43% 1fr; padding: 15px 20px; }
.tm { font-size: 15px; }
.tm small { font-size: 11.5px; font-weight: 700; color: var(--ink-soft); }
.rel { margin-top: 2px; }
.tpl-top { gap: 9px; }
.tpl-name { font-size: 14.5px; }
.tpl-name svg { color: #a3abc6; }
.tpl .code { margin-top: 6px; }
.plan { height: 22px; font-size: 11.5px; }
.url { gap: 11px; }
.url .ui { width: 38px; height: 38px; border-radius: 12px; background: var(--blue-tint); color: var(--blue); border: 1px solid var(--blue-line); }
.url.sd .ui { background: var(--green-tint); color: var(--green-deep); border-color: var(--green-line); }
.url.sd a.u { color: var(--green-deep); }
.url a.u { font-size: 14.5px; }
.kind { margin-top: 2px; }

.tfoot { padding: 14px 22px; background: #fff; }
.pager button.cur { background: var(--green); color: #fff; border-color: var(--green); }
</style>
</head>
<body>
<div class="app">

  <header class="page-head">
    <div class="ph-ico" id="phIco"></div>
    <h1>Website Publish History</h1>
    <span class="grow"></span>
    <span class="total" id="total"></span>
  </header>

  <div class="retain" id="retain"></div>

  <section class="live" id="live" hidden></section>

  <section class="tcard">
    <div class="t-head">
      <h2>All publishes <span class="cnt" id="cnt"></span></h2>
      <button type="button" class="sortbtn" id="sortBtn"></button>
    </div>
    <div class="twrap">
      <div class="days" id="rows"></div>
    </div>
    <div id="empty" class="empty" hidden></div>
    <div class="tfoot" id="tfoot">
      <div class="info" id="info"></div>
      <div class="right">
        <label class="psize">Rows <select id="psize"><option>10</option><option>25</option><option>50</option></select></label>
        <div class="pager" id="pager"></div>
      </div>
    </div>
  </section>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var I = function (d, s) { s = s || 18; return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + d + "</svg>"; };
  var ICON = {
    rocket: '<path d="M5 19c-1 0-2-1-2-2 0-2 2-3 3-3M5 19c0 1 1 2 2 2 2 0 3-2 3-3"/><path d="M12 15l-3-3a15 15 0 0 1 4.5-7.5C16 2.5 19 2.5 21 3c.5 2 .5 5-2 7.5A15 15 0 0 1 12 15z"/><circle cx="15.5" cy="8.5" r="1.3"/>',
    crown: '<path d="M4 8l4 4 4-7 4 7 4-4-1.5 10h-13z"/>',
    globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 4 5.7 4 9s-1.4 6.4-4 9c-2.6-2.6-4-5.7-4-9s1.4-6.4 4-9z"/>',
    sub: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 4 5.7 4 9"/>',
    down: '<path d="M12 5v14M6 13l6 6 6-6"/>',
    ext: '<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    gift: '<rect x="3.5" y="9" width="17" height="11" rx="2"/><path d="M3 9h18v3H3zM12 9v11M8 9a2.2 2.2 0 1 1 0-4.4C10.5 4.6 12 9 12 9s1.5-4.4 4-4.4A2.2 2.2 0 1 1 16 9"/>'
  };
  $("phIco").innerHTML = I(ICON.rocket, 26);
  var LIMIT = 20, DAYS = 60;   /* only the latest 20 publishes are kept */
  $("retain").innerHTML = '<span class="ri">' + I(ICON.clock, 17) + '</span><span><b>Showing your last ' + LIMIT + ' publishes.</b> Every time you publish your main website, a record is added here. Older records are removed.</span>';

  var TEMPLATES = [
    { code: "solis_classic_fire_bolt", name: "Solis Classic Fire Bolt", plan: "Free", tone: "rose" },
    { code: "aurora_classic_azure_blue", name: "Aurora Classic Azure Blue", plan: "Free", tone: "blue" },
    { code: "solis_classic_maroon", name: "Solis Classic Maroon", plan: "Free", tone: "rose" },
    { code: "aurora_classic_bondi_blue", name: "Aurora Classic Bondi Blue", plan: "Free", tone: "blue" },
    { code: "solis_classic_emerald", name: "Solis Classic Emerald", plan: "Free", tone: "green" },
    { code: "aurora_classic_oxford_blue", name: "Aurora Classic Oxford Blue", plan: "Free", tone: "blue" },
    { code: "aurora_classic_spanish_blue", name: "Aurora Classic Spanish Blue", plan: "Free", tone: "blue" },
    { code: "aurora_classic_vibrant_blue", name: "Aurora Classic Vibrant Blue", plan: "Free", tone: "blue" },
    { code: "aurora_classic_retro_green", name: "Aurora Classic Retro Green", plan: "Free", tone: "green" },
    { code: "solis_classic_deep_navy", name: "Solis Classic Deep Navy", plan: "Free", tone: "blue" }
  ];
  var SITES = [
    { host: "demoschool.com", kind: "Domain" },
    { host: "demo.edusite.com", kind: "Subdomain" },
    { host: "www.demoschool.com", kind: "Domain" }
  ];
  var SCHOOL_CODE = "scl-1.vidyaone.com";
  function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var rnd = rng(907);
  var now = new Date(), sod = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var items = [];
  for (var n = 0; n < 26; n++) {
    var back = n === 0 ? 0 : (n < 3 ? 1 : 2) + Math.floor(rnd() * (DAYS - 2));
    if (n === 2) back = 1;
    var at = new Date(sod.getTime() - back * 86400000 + (8 + Math.floor(rnd() * 10)) * 3600000 + Math.floor(rnd() * 60) * 60000 + Math.floor(rnd() * 60) * 1000);
    if (at > now) at = new Date(now.getTime() - (40 + Math.floor(rnd() * 120)) * 60000);
    var t = TEMPLATES[Math.floor(rnd() * TEMPLATES.length)];
    var s = back < 14 ? SITES[0] : back < 23 ? SITES[1] : SITES[2];
    items.push({ at: at, tpl: t, site: s });
  }
  items.sort(function (a, b) { return a.at - b.at; });
  items = items.slice(-LIMIT);   /* newest 20 only */
  var latest = items.length ? items[items.length - 1] : null;

  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var WD = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function fmtD(d) { return pad(d.getDate()) + " " + MON[d.getMonth()] + " " + d.getFullYear(); }
  function time12(d) { var h = d.getHours(); h = h % 12 || 12; return pad(h) + ":" + pad(d.getMinutes()); }
  function ampm(d) { return d.getHours() >= 12 ? "PM" : "AM"; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }
  function ageDays(d) { return Math.round((sod - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000); }
  function rel(d) {
    var m = Math.round((now - d) / 60000);
    if (m < 1) return "Just now"; if (m < 60) return plural(m, "minute") + " ago";
    var h = Math.floor(m / 60); if (h < 24 && ageDays(d) === 0) return plural(h, "hour") + " ago";
    var a = ageDays(d); return a === 1 ? "Yesterday" : a + " days ago";
  }
  function dayLabel(d) { var a = ageDays(d); return a === 0 ? "Today" : a === 1 ? "Yesterday" : WD[d.getDay()]; }
  function dayKey(d) { return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); }
  var tplUrl = function (c) { return "https://vidyaone.com/school-website/templates/" + c + "/"; };
  function prev(tone) { return '<span class="prev tn-' + tone + '" aria-hidden="true"><i></i><i></i><span class="r"><i></i><i></i><i></i></span></span>'; }
  function planChip(p) { return '<span class="plan plan-' + p.toLowerCase() + '">' + I(p === "Paid" ? ICON.crown : ICON.gift, 13) + (p === "Free" ? "Free template" : "Paid template") + "</span>"; }

  function renderLive() {
    var L = $("live"); if (!latest) { L.hidden = true; return; }
    var T = latest.tpl, W = latest.site; L.hidden = false;
    L.innerHTML = '<div class="live-l"><div style="min-width:0"><div class="live-kicker"><span class="live-tag"><i></i>Live now</span></div>' +
      '<a class="live-name" href="' + tplUrl(T.code) + '" target="_blank" rel="noopener">' + esc(T.name) + I(ICON.ext, 14) + '</a>' +
      '<div class="live-sub">' + planChip(T.plan) + '<span class="code">' + SCHOOL_CODE + "</span></div></div></div>" +
      '<div class="live-r"><div class="live-site"><div class="k">Website address</div><a href="https://' + W.host + '" target="_blank" rel="noopener">' + W.host + I(ICON.ext, 15) + "</a><small>" + W.kind + " · published " + fmtD(latest.at) + ", " + time12(latest.at) + " " + ampm(latest.at) + " (" + rel(latest.at) + ")</small></div>" +
      '<span class="live-ico">' + I(W.kind === "Domain" ? ICON.globe : ICON.sub, 22) + "</span></div>";
  }

  var S = { dir: "desc", page: 1, size: 10 };
  function sorted() { var m = S.dir === "asc" ? 1 : -1; return items.slice().sort(function (a, b) { return (a.at - b.at) * m; }); }
  function pageNums(cur, tot) {
    var out = [];
    if (tot <= 7) { for (var i = 1; i <= tot; i++) out.push(i); return out; }
    out.push(1); if (cur > 3) out.push("…");
    for (var j = Math.max(2, cur - 1); j <= Math.min(tot - 1, cur + 1); j++) out.push(j);
    if (cur < tot - 2) out.push("…"); out.push(tot); return out;
  }
  function row(r) {
    var T = r.tpl, W = r.site;
    return '<div class="rec"><div><div class="tm">' + time12(r.at) + "<small> " + ampm(r.at) + '</small></div><div class="rel">' + rel(r.at) + '</div></div>' +
      '<div><div class="tpl"><div><div class="tpl-top"><a class="tpl-name" href="' + tplUrl(T.code) + '" target="_blank" rel="noopener" title="Open template page">' + esc(T.name) + I(ICON.ext, 13) + "</a>" + planChip(T.plan) + '</div><span class="code">' + SCHOOL_CODE + "</span></div></div></div>" +
      '<div><div class="url' + (W.kind === "Subdomain" ? " sd" : "") + '"><span class="ui">' + I(W.kind === "Domain" ? ICON.globe : ICON.sub, 17) + '</span><div><a class="u" href="https://' + W.host + '" target="_blank" rel="noopener">' + W.host + I(ICON.ext, 13) + '</a><span class="kind">' + W.kind + "</span></div></div></div></div>";
  }
  function render() {
    $("total").innerHTML = I(ICON.rocket, 17) + "Last <b>" + items.length + "</b> publishes";
    $("cnt").textContent = items.length;
    $("sortBtn").innerHTML = I(ICON.down, 15) + (S.dir === "desc" ? "Newest first" : "Oldest first");
    $("sortBtn").classList.toggle("asc", S.dir === "asc");
    var f = sorted(), total = f.length, pages = Math.max(1, Math.ceil(total / S.size));
    if (S.page > pages) S.page = pages;
    var start = (S.page - 1) * S.size, slice = f.slice(start, start + S.size);
    var html = "", lastKey = "", open = false;
    slice.forEach(function (r) {
      var k = dayKey(r.at);
      if (k !== lastKey) { lastKey = k; var a = ageDays(r.at);
        if (open) html += "</div>"; open = true;
        html += '<div class="day' + (a === 0 ? " today" : "") + '"><div class="dh"><div class="g"><span class="dot' + (a === 0 ? "" : " old") + '"></span>' + dayLabel(r.at) + ' <span class="n">· ' + fmtD(r.at) + "</span></div></div>"; }
      html += row(r);
    });
    if (open) html += "</div>";
    $("rows").innerHTML = html;
    $("rows").closest(".twrap").hidden = total === 0; $("tfoot").hidden = total === 0;
    var em = $("empty"); em.hidden = total !== 0;
    if (total === 0) em.innerHTML = '<div class="e-ico">' + I(ICON.rocket, 28) + "</div><h3>No publishes yet</h3><p>When you publish your main website, the record will show up here.</p>";
    $("info").textContent = total ? "Showing " + (start + 1) + "–" + (start + slice.length) + " of " + total + " records" : "";
    $("pager").innerHTML = '<button type="button" data-pg="prev" aria-label="Previous page"' + (S.page === 1 ? " disabled" : "") + ">" + I('<path d="m15 6-6 6 6 6"/>', 16) + "</button>" +
      pageNums(S.page, pages).map(function (p) { return p === "…" ? '<span class="dots">…</span>' : '<button type="button" data-pg="' + p + '"' + (p === S.page ? ' class="cur" aria-current="page"' : "") + ">" + p + "</button>"; }).join("") +
      '<button type="button" data-pg="next" aria-label="Next page"' + (S.page === pages ? " disabled" : "") + ">" + I('<path d="m9 6 6 6-6 6"/>', 16) + "</button>";
  }
  $("sortBtn").addEventListener("click", function () { S.dir = S.dir === "desc" ? "asc" : "desc"; S.page = 1; render(); });
  $("psize").addEventListener("change", function (e) { S.size = +e.target.value; S.page = 1; render(); });
  $("pager").addEventListener("click", function (e) {
    var b = e.target.closest("[data-pg]"); if (!b || b.disabled) return;
    var v = b.getAttribute("data-pg"); S.page = v === "prev" ? S.page - 1 : v === "next" ? S.page + 1 : +v; render();
    document.querySelector(".tcard").scrollIntoView({ block: "start", behavior: "smooth" });
  });
  renderLive(); render();
})();
</script>
</body>
</html>
