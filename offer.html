(on ? 'linear-gradient(145deg,#4B33B8,#2A1B6B)' : '#FFFFFF') + ';color:' + (on ? '#FFE08A' : '#2A1B6B') + ';box-shadow:' + (on ? '0 10px 22px rgba(42,27,107,.35)' : 'none'), op: on ? 1 : 0, pr: on ? 'true' : 'false' }; };\n    const A = mk('School Software'), B = mk('School Website'), C = mk('Both');\n    const picks = { sA: A.st, sB: B.st, sC: C.st, oA: A.op, oB: B.op, oC: C.op, pA: A.pr, pB: B.pr, pC: C.pr,\n      pickA: () => this.setState({ interest: 'School Software' }), pickB: () => this.setState({ interest: 'School Website' }), pickC: () => this.setState({ interest: 'Both' }) };\n    return {\n      confetti, balloons, flags, faces, countdown, ...picks,\n      cdTitle: live ? 'Offers are live now' : 'Offers go live in',\n      steps: [\n        { n: '1', title: 'Share your details', text: 'Fill in your name, mobile number and school name.' },\n        { n: '2', title: 'Book your offer', text: 'Reserve the anniversary offer you want, in advance.' },\n        { n: '3', title: 'Team VIDYAOne contacts you', text: 'We will contact you with your special-price offer details.' }\n      ],\n      showForm: !s.booked, booked: s.booked, hasError: !!s.error, error: s.error,\n      bName: s.bName, bMobile: s.bMobile, bSchool: s.bSchool, bInterest: s.bInterest, ref: s.ref,\n      vName: this._v.name, vMobile: this._v.mobile, vSchool: this._v.school,\n      onName: (e) => { this._v.name = e.target.value; },\n      onMobile: (e) => { this._v.mobile = e.target.value; },\n      onSchool: (e) => { this._v.school = e.target.value; },\n      submit: (e) => {\n        if (e && e.preventDefault) e.preventDefault();\n        const n = this._v.name.trim(), mo = this._v.mobile.replace(/\\s/g, ''), sc = this._v.school.trim();\n        if (!n) return this.setState({ error: 'Please enter your name.' });\n        if (!/^[6-9]\\d{9}$/.test(mo)) return this.setState({ error: 'Please enter a valid 10-digit mobile number.' });\n        if (!sc) return this.setState({ error: 'Please enter your school name.' });\n        const ref = 'V1-11-' + String(Math.floor(1000 + Math.random() * 9000));\n        this.setState({ booked: true, error: '', bName: n, bMobile: mo, bSchool: sc, bInterest: s.interest, ref });\n      },\n      reset: () => { this._v = { name: '', mobile: '', school: '' }; this.setState({ booked: false, error: '' }); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
