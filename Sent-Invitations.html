<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sent Invitations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout idea: same system as Pending Requests. One title row with the Add User button, one filter bar, a dense table, then paging. */
  --ink: #14173d;
  --ink-soft: #5b6188;
  --line: #e6eaf2;
  --green: #16a34a;
  --green-deep: #12803c;
  --green-tint: #eaf7ee;
  --green-line: #bfe6cb;
  --blue: #2f6fe4;
  --blue-deep: #1f55b8;
  --blue-tint: #e8f1ff;
  --blue-line: #c9dcfb;
  --yellow: #a8670a;
  --yellow-tint: #fff6dc;
  --yellow-line: #f1dd9c;
  --rose: #c8323f;
  --rose-tint: #fdecee;
  --rose-line: #f6c9ce;
  --slate: #56607f;
  --slate-tint: #eef1f7;
  --slate-line: #d9dfeb;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --shadow: 0 1px 2px rgba(20,23,61,.04), 0 12px 32px -14px rgba(20,23,61,.12);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); color: var(--ink); background: #fff; line-height: 1.45; -webkit-font-smoothing: antialiased; min-height: 100vh; padding: 32px 20px 64px; }
[hidden] { display: none !important; }
button, input, textarea, select { font: inherit; color: inherit; }
svg { display: block; flex: none; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid rgba(22,163,74,.35); outline-offset: 2px; }
.pimg { display: block; object-fit: contain; }
.app { width: 100%; max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

/* ---------- Title ---------- */
.page-head { display: flex; align-items: center; gap: 14px; padding: 2px; flex-wrap: wrap; }
.page-head .ph-ico { width: 48px; height: 48px; border-radius: 15px; background: var(--green-tint); color: var(--green-deep); display: grid; place-items: center; border: 1px solid var(--green-line); }
.page-head h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
.page-head .grow { flex: 1; }

/* ---------- Filters ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search { position: relative; flex: 1 1 260px; min-width: 220px; }
.search svg.s-ico { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); pointer-events: none; }
.search input { width: 100%; height: 40px; border: 1.5px solid var(--line); border-radius: 12px; padding: 0 36px 0 38px; font-size: 14px; font-weight: 500; background: #fff; transition: border-color .15s, box-shadow .15s; }
.search input::placeholder { color: #98a0bd; }
.search input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 4px rgba(22,163,74,.10); }
.search .clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; border: 0; border-radius: 8px; background: #f1f3f9; color: var(--ink-soft); display: grid; place-items: center; cursor: pointer; }
.sel { position: relative; }
.sel select { appearance: none; -webkit-appearance: none; height: 40px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; padding: 0 34px 0 38px; font-size: 14px; font-weight: 600; cursor: pointer; min-width: 150px; max-width: 240px; transition: border-color .15s, box-shadow .15s, background .15s; }
.sel select:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 4px rgba(22,163,74,.10); }
.sel.on select { border-color: var(--green-line); background: var(--green-tint); color: var(--green-deep); }
.sel .l-ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); pointer-events: none; }
.sel.on .l-ico { color: var(--green-deep); }
.sel .chev { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); pointer-events: none; }
.range { display: flex; align-items: center; gap: 8px; }
.range input { height: 40px; border: 1.5px solid var(--line); border-radius: 12px; padding: 0 10px; font-size: 13.5px; font-weight: 600; background: #fff; }
.range input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 4px rgba(22,163,74,.10); }
.range span { font-size: 13px; color: var(--ink-soft); font-weight: 600; }
.reset { height: 40px; border: 0; background: transparent; color: var(--ink-soft); font-weight: 700; font-size: 13.5px; padding: 0 8px; cursor: pointer; border-radius: 10px; }
.reset:hover { color: var(--rose); }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px 0 10px; border-radius: 10px; border: 1px solid transparent; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: background .15s, box-shadow .15s, transform .1s, color .15s; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-solid { background: linear-gradient(180deg, #22b457, #16a34a); color: #fff; box-shadow: 0 8px 18px -8px rgba(22,163,74,.7); height: 40px; padding: 0 18px 0 14px; }
.btn-solid:hover { background: linear-gradient(180deg, #1ea84f, #12803c); }
.btn-ghost { background: #fff; color: var(--ink); border-color: var(--line); height: 40px; padding: 0 16px; }
.btn-ghost:hover { background: #f4f6fb; }
.btn-del { background: var(--rose-tint); color: var(--rose); border-color: var(--rose-line); }
.btn-del:hover { background: #fadde0; }
.btn-del.lg { height: 40px; padding: 0 16px 0 13px; }
.btn-resend { padding: 0 10px 0 8px; background: var(--blue-tint); color: var(--blue-deep); border-color: var(--blue-line); }
.btn-resend:hover { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn-resend.lg { height: 40px; padding: 0 16px 0 13px; }
.icon-btn { width: 34px; padding: 0; }

/* ---------- Note ---------- */
.retain { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; background: var(--yellow-tint); border: 1px solid var(--yellow-line); font-size: 13.5px; color: #6b4306; font-weight: 500; }
.retain b { font-weight: 800; }
.retain .ri { width: 30px; height: 30px; border-radius: 10px; background: #fff; border: 1px solid var(--yellow-line); color: var(--yellow); display: grid; place-items: center; flex: none; }

/* ---------- Table ---------- */
.tcard { border: 1px solid var(--line); border-radius: 22px; background: #fff; box-shadow: var(--shadow); overflow: hidden; }
.twrap { overflow-x: auto; }
table { width: 100%; min-width: 1100px; border-collapse: collapse; }
thead th { background: #fafbfe; text-align: left; font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-soft); padding: 12px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
thead th.r { text-align: right; }
.sort { border: 0; background: transparent; padding: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
.sort:hover, .sort.on { color: var(--ink); }
.sort .arr { opacity: .35; transition: transform .15s, opacity .15s; }
.sort.on .arr { opacity: 1; color: var(--green-deep); }
.sort.on.asc .arr { transform: rotate(180deg); }
tbody td { padding: 11px 6px; border-bottom: 1px solid #eef1f7; vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: #fafbfe; }
td.c-no, th.c-no { width: 44px; padding-left: 16px; color: var(--ink-soft); font-weight: 700; font-size: 13px; }

.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 13.5px; font-weight: 800; flex: none; background: var(--ab); color: var(--ac); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--al); }
.av.t0 { --ab: var(--green-tint); --ac: var(--green-deep); --al: var(--green-line); }
.av.t1 { --ab: var(--blue-tint); --ac: var(--blue-deep); --al: var(--blue-line); }
.av.t2 { --ab: var(--yellow-tint); --ac: var(--yellow); --al: var(--yellow-line); }
.av.t3 { --ab: var(--rose-tint); --ac: var(--rose); --al: var(--rose-line); }
.who-t { min-width: 0; }
.nm { font-weight: 800; font-size: 14.5px; white-space: nowrap; }
.ln { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-soft); font-weight: 500; margin-top: 1px; white-space: nowrap; }
.ln svg { color: #8c94b3; }
.ln a:hover { color: var(--blue); text-decoration: underline; }

.inst-c { display: flex; align-items: center; gap: 8px; min-width: 0; }
.inst-c .il { width: 24px; height: 24px; display: grid; place-items: center; flex: none; color: var(--green-deep); }
.inst-c strong { font-size: 13px; font-weight: 700; line-height: 1.25; white-space: nowrap; }
.inst-c small { display: block; font-size: 12px; color: var(--ink-soft); font-weight: 500; }

.prod { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 5px; border-radius: 12px; background: #fff; border: 1px solid var(--pl); }
.prod .pi { width: 26px; height: 26px; border-radius: 9px; background: var(--pb); display: grid; place-items: center; flex: none; }
.prod strong { font-size: 12px; font-weight: 700; white-space: nowrap; }
.pc-blue { --pb: var(--blue-tint); --pl: var(--blue-line); }
.pc-yellow { --pb: var(--yellow-tint); --pl: var(--yellow-line); }
.pc-green { --pb: var(--green-tint); --pl: var(--green-line); }
.more { margin-left: 5px; height: 26px; padding: 0 7px; border-radius: 8px; border: 1px solid var(--blue-line); background: var(--blue-tint); color: var(--blue-deep); font-size: 12.5px; font-weight: 800; cursor: pointer; vertical-align: middle; white-space: nowrap; }
.more:hover { background: var(--blue); color: #fff; border-color: var(--blue); }

.role-pill { display: inline-flex; align-items: center; height: 28px; padding: 0 11px; border-radius: 9px; font-size: 13px; font-weight: 700; background: var(--rb); color: var(--rc); border: 1px solid var(--rl); }
.r-admin { --rb: var(--yellow-tint); --rc: var(--yellow); --rl: var(--yellow-line); }
.r-operator { --rb: var(--green-tint); --rc: var(--green-deep); --rl: var(--green-line); }
.r-viewer { --rb: var(--blue-tint); --rc: var(--blue-deep); --rl: var(--blue-line); }

.dt { font-size: 13.5px; font-weight: 700; white-space: nowrap; }
.tm { font-size: 12px; color: var(--ink-soft); font-weight: 500; white-space: nowrap; }
.exp { display: inline-flex; align-items: center; gap: 7px; }
.exp .ei { width: 22px; height: 22px; display: grid; place-items: center; color: var(--ec); flex: none; }
.exp b { display: block; font-size: 13px; font-weight: 800; color: var(--ec); white-space: nowrap; }
.exp span.d { display: block; font-size: 12px; color: var(--ink-soft); font-weight: 500; }
.e-ok { --eb: var(--green-tint); --ec: var(--green-deep); }
.e-soon { --eb: var(--yellow-tint); --ec: var(--yellow); }
.e-bad { --eb: var(--rose-tint); --ec: var(--rose); }
.acts { display: flex; gap: 8px; justify-content: flex-end; }

/* ---------- Footer / pagination ---------- */
.tfoot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); background: #fafbfe; }
.tfoot .info { font-size: 13px; color: var(--ink-soft); font-weight: 600; }
.tfoot .right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.psize { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink-soft); }
.psize select { height: 32px; border: 1.5px solid var(--line); border-radius: 9px; background: #fff; padding: 0 8px; font-weight: 700; font-size: 13px; cursor: pointer; }
.pager { display: flex; gap: 4px; align-items: center; }
.pager button { min-width: 32px; height: 32px; border-radius: 9px; border: 1px solid transparent; background: transparent; font-size: 13px; font-weight: 700; color: var(--ink-soft); cursor: pointer; display: grid; place-items: center; padding: 0 8px; }
.pager button:hover:not(:disabled) { background: #fff; border-color: var(--line); color: var(--ink); }
.pager button.cur { background: var(--green-tint); color: var(--green-deep); border-color: var(--green-line); }
.pager button:disabled { opacity: .4; cursor: default; }
.pager .dots { color: #98a0bd; font-weight: 700; padding: 0 4px; }

/* ---------- Empty ---------- */
.empty { padding: 56px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }
.empty .e-ico { width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center; background: var(--green-tint); color: var(--green-deep); margin-bottom: 6px; }
.empty h3 { margin: 0; font-size: 18px; font-weight: 800; }
.empty p { margin: 0; font-size: 14px; color: var(--ink-soft); max-width: 46ch; }
.empty .btn { margin-top: 10px; }

/* ---------- Select (shared) ---------- */
.rsel { position: relative; display: block; }
.rsel select { appearance: none; -webkit-appearance: none; width: 100%; height: 40px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; padding: 0 32px 0 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.rsel select:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 4px rgba(22,163,74,.10); }
.rsel select:disabled { background: #f7f8fc; color: #98a0bd; cursor: not-allowed; }
.rsel .chev { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--ink-soft); }
.rsel.has-ico select { padding-left: 40px; }
.rsel .l-ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); pointer-events: none; }
.rsel.bad select { border-color: var(--rose); box-shadow: 0 0 0 4px rgba(200,50,63,.08); }

/* ---------- Modal (confirm) ---------- */
.overlay { position: fixed; inset: 0; background: rgba(20,23,61,.35); backdrop-filter: blur(2px); display: grid; place-items: center; padding: 20px; z-index: 20; overflow-y: auto; }
.modal { width: 100%; max-width: 460px; background: #fff; border-radius: 22px; padding: 24px; box-shadow: 0 30px 70px -20px rgba(20,23,61,.45); }
.modal .m-ico { width: 48px; height: 48px; border-radius: 15px; display: grid; place-items: center; margin-bottom: 14px; border: 1px solid transparent; }
.m-ico.rej { background: var(--rose-tint); color: var(--rose); border-color: var(--rose-line); }
.modal h3 { margin: 0 0 6px; font-size: 19px; font-weight: 800; }
.modal p { margin: 0; font-size: 14px; color: var(--ink-soft); }
.sumbox { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: #fafbfd; border: 1px solid var(--line); font-size: 13.5px; font-weight: 700; }
.sumbox small { display: block; font-weight: 600; color: var(--ink-soft); font-size: 12.5px; margin-top: 2px; }
.m-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

/* ---------- Add User modal ---------- */
.au { max-width: 940px; padding: 0; overflow: hidden; }
.au-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); }
.au-col { padding: 26px 28px; }
.au-col + .au-col { border-left: 1px solid var(--line); background: #fcfdff; }
.au h2 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
.au .sub { margin: 4px 0 18px; font-size: 14px; color: var(--ink-soft); }
.f { margin-top: 16px; }
.f > label, .f > .lab { display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 800; margin-bottom: 7px; }
.req { color: var(--rose); }
.hint { font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; font-weight: 500; }
.ferr { margin-top: 6px; font-size: 12.5px; font-weight: 700; color: var(--rose); }
.tip { position: relative; display: inline-grid; place-items: center; color: var(--ink-soft); cursor: help; }
.tip .tt { position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 12px; font-weight: 600; padding: 7px 10px; border-radius: 8px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 5; }
.tip:hover .tt, .tip:focus .tt { opacity: 1; }
.assign { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--green-tint); border: 1px solid var(--green-line); margin-top: 16px; }
.assign .ai { width: 40px; height: 40px; border-radius: 12px; background: #fff; border: 1px solid var(--green-line); color: var(--green-deep); display: grid; place-items: center; flex: none; }
.assign .at { flex: 1; min-width: 0; }
.assign strong { display: block; font-size: 14.5px; font-weight: 800; }
.assign span.s { font-size: 12.5px; color: var(--ink-soft); font-weight: 500; }
.sw { position: relative; width: 46px; height: 26px; flex: none; }
.sw input { position: absolute; inset: 0; opacity: 0; cursor: pointer; margin: 0; width: 100%; height: 100%; z-index: 1; }
.sw i { position: absolute; inset: 0; border-radius: 99px; background: #c9d0e2; transition: background .15s; }
.sw i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.sw input:checked + i { background: var(--green); }
.sw input:checked + i::after { transform: translateX(20px); }
.sw input:focus-visible + i { outline: 3px solid rgba(22,163,74,.35); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: 48px; padding: 7px 10px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; cursor: text; transition: border-color .15s, box-shadow .15s; }
.chips:focus-within { border-color: var(--green); box-shadow: 0 0 0 4px rgba(22,163,74,.10); }
.chips.bad { border-color: var(--rose); box-shadow: 0 0 0 4px rgba(200,50,63,.08); }
.ec { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px 0 11px; border-radius: 9px; background: var(--green-tint); border: 1px solid var(--green-line); font-size: 13.5px; font-weight: 600; color: var(--green-deep); }
.ec button { width: 20px; height: 20px; border: 0; border-radius: 6px; background: transparent; color: var(--green-deep); display: grid; place-items: center; cursor: pointer; padding: 0; }
.ec button:hover { background: #d3eddb; }
.chips input { flex: 1; min-width: 150px; border: 0; outline: none; background: transparent; height: 30px; font-size: 14px; font-weight: 500; }
.pr-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.pr { display: grid; grid-template-columns: auto auto minmax(0, 1fr) 150px; gap: 12px; align-items: center; padding: 12px; border-radius: 16px; border: 1px solid var(--line); background: #fff; transition: background .15s, border-color .15s; }
.pr.on { background: var(--green-tint); border-color: var(--green-line); }
.pr .pi { width: 44px; height: 44px; border-radius: 13px; background: var(--pb); display: grid; place-items: center; }
.pr strong { display: block; font-size: 14.5px; font-weight: 800; }
.pr small { display: block; font-size: 12.5px; color: var(--ink-soft); font-weight: 500; line-height: 1.3; }
.pr .rl { font-size: 11.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 4px; }
.pr .rsel select { height: 38px; font-size: 13.5px; }
.chk { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; border: 1.8px solid #c3cbe0; border-radius: 6px; background: #fff; display: grid; place-items: center; cursor: pointer; margin: 0; transition: background .12s, border-color .12s; }
.chk:hover { border-color: var(--green); }
.chk:checked { background: var(--green); border-color: var(--green); }
.chk:checked::after { content: ""; width: 9px; height: 5px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }
.au-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 28px; border-top: 1px solid var(--line); background: #fff; }

/* ---------- Right side panel ---------- */
.d-over { position: fixed; inset: 0; background: rgba(20,23,61,.28); z-index: 15; display: flex; justify-content: flex-end; animation: fade .18s ease; }
.drawer { width: 100%; max-width: 480px; height: 100%; background: #fff; display: flex; flex-direction: column; box-shadow: -24px 0 60px -20px rgba(20,23,61,.35); animation: slide .22s ease; }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.d-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--line); }
.d-head h2 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
.d-x { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: #fff; display: grid; place-items: center; cursor: pointer; color: var(--ink-soft); }
.d-x:hover { background: var(--rose-tint); color: var(--rose); border-color: var(--rose-line); }
.d-body { flex: 1; overflow-y: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; }
.d-sec { border: 1px solid var(--line); border-radius: 18px; padding: 16px; background: #fff; }
.d-k { font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.cnt { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 7px; background: var(--slate-tint); color: var(--slate); font-size: 11.5px; letter-spacing: 0; }

    $("info").textContent = total ? "Showing " + (start + 1) + "–" + (start + slice.length) + " of " + total + (anyFilter() ? " matching invitations" : " invitations") : "";
    $("pager").innerHTML = '<button type="button" data-pg="prev" aria-label="Previous page"' + (S.page === 1 ? " disabled" : "") + ">" + I('<path d="m15 6-6 6 6 6"/>', 16) + "</button>" +
      pageNums(S.page, pages).map(function (p) { return p === "…" ? '<span class="dots">…</span>' : '<button type="button" data-pg="' + p + '"' + (p === S.page ? ' class="cur" aria-current="page"' : "") + ">" + p + "</button>"; }).join("") +
      '<button type="button" data-pg="next" aria-label="Next page"' + (S.page === pages ? " disabled" : "") + ">" + I('<path d="m9 6 6 6-6 6"/>', 16) + "</button>";
    Array.prototype.forEach.call(document.querySelectorAll(".sort"), function (b) {
      var on = b.getAttribute("data-sort") === S.sort; b.classList.toggle("on", on); b.classList.toggle("asc", on && S.dir === "asc");
    });
    $("selInst").classList.toggle("on", S.inst !== ""); $("selProduct").classList.toggle("on", !!S.product); $("selRole").classList.toggle("on", !!S.role); $("selDate").classList.toggle("on", !!S.date);
    $("range").hidden = S.date !== "custom"; $("reset").hidden = !anyFilter(); $("qClear").hidden = !S.q;
  }

  /* ---- filter + sort events ---- */
  function resetPage() { S.page = 1; render(); }
  var qT; $("q").addEventListener("input", function (e) { clearTimeout(qT); var v = e.target.value.trim(); qT = setTimeout(function () { S.q = v; resetPage(); }, 120); });
  $("qClear").addEventListener("click", function () { $("q").value = ""; S.q = ""; resetPage(); $("q").focus(); });
  $("fInst").addEventListener("change", function (e) { S.inst = e.target.value; resetPage(); });
  $("fProduct").addEventListener("change", function (e) { S.product = e.target.value; resetPage(); });
  $("fRole").addEventListener("change", function (e) { S.role = e.target.value; resetPage(); });
  $("fDate").addEventListener("change", function (e) { S.date = e.target.value; resetPage(); });
  $("dFrom").addEventListener("change", function (e) { S.from = e.target.value; resetPage(); });
  $("dTo").addEventListener("change", function (e) { S.to = e.target.value; resetPage(); });
  $("psize").addEventListener("change", function (e) { S.size = +e.target.value; resetPage(); });
  function clearFilters() { S.q = S.inst = S.product = S.role = S.date = S.from = S.to = ""; $("q").value = ""; $("fInst").value = $("fProduct").value = $("fRole").value = $("fDate").value = ""; $("dFrom").value = $("dTo").value = ""; resetPage(); }
  $("reset").addEventListener("click", clearFilters);
  $("empty").addEventListener("click", function (e) { if (e.target.closest("#emptyClear")) clearFilters(); if (e.target.closest("#emptyAdd")) openAdd(e.target.closest("#emptyAdd")); });
  document.querySelector("thead").addEventListener("click", function (e) {
    var s = e.target.closest("[data-sort]"); if (!s) return;
    S.dir = S.dir === "desc" ? "asc" : "desc"; resetPage();
  });
  $("pager").addEventListener("click", function (e) {
    var b = e.target.closest("[data-pg]"); if (!b || b.disabled) return;
    var v = b.getAttribute("data-pg"); S.page = v === "prev" ? S.page - 1 : v === "next" ? S.page + 1 : +v; render();
    document.querySelector(".tcard").scrollIntoView({ block: "start", behavior: "smooth" });
  });

  function byId(id) { return items.filter(function (r) { return r.id === id; })[0]; }

  /* ---- row actions ---- */
  $("rows").addEventListener("click", function (e) {
    var o = e.target.closest("[data-open]"); if (o) { openDrawer(+o.getAttribute("data-open"), o); return; }
    var b = e.target.closest("[data-act]"); if (!b) return;
    var r = byId(+b.getAttribute("data-id")); if (!r) return;
    if (b.getAttribute("data-act") === "resend") resend(r); else openConfirm(r, b);
  });
  function resend(r) {
    closeDrawer(true); r.at = new Date(); render();
    toast(true, "Invitation resent", "New expiry " + fmtD(expiryOf(r.at)) + " for " + r.email, false);
  }

  /* ---- confirm delete ---- */
  var modal = null, opener = null;
  function openConfirm(r, from) {
    closeModal(); opener = from;
    var o = document.createElement("div"); o.className = "overlay";
    o.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mT"><div class="m-ico rej">' + I(ICON.trash, 24) + '</div><h3 id="mT">Delete this invitation?</h3><p>The invitee will no longer be able to use it to join.</p>' +
      '<div class="sumbox">' + esc(r.email) + "<small>" + INSTS[r.inst].name + " · " + r.products.map(function (k) { return PRODUCTS[k].name; }).join(", ") + "</small></div>" +
      '<div class="m-actions"><button type="button" class="btn btn-ghost" data-m="cancel">Cancel</button><button type="button" class="btn btn-del lg" data-m="ok">' + I(ICON.trash, 16) + "Delete</button></div></div>";
    document.body.appendChild(o); modal = o;
    o.addEventListener("click", function (e) {
      if (e.target === o || e.target.closest('[data-m="cancel"]')) { closeModal(); return; }
      if (e.target.closest('[data-m="ok"]')) { closeModal(true); closeDrawer(true); items = items.filter(function (x) { return x.id !== r.id; }); last = r; render(); toast(false, "Invitation deleted", r.email, true); }
    });
    setTimeout(function () { var f = o.querySelector('[data-m="ok"]'); if (f) f.focus(); }, 30);
  }
  function closeModal(keep) { if (modal) { modal.remove(); modal = null; if (!keep && opener && document.body.contains(opener)) opener.focus(); } }

  /* ---- toast ---- */
  function toast(ok, title, body, undo) {
    $("tIco").className = "t-ico " + (ok ? "acc" : "rej"); $("tIco").innerHTML = I(ok ? ICON.check : ICON.trash, 18);
    $("tTitle").textContent = title; $("tBody").textContent = body; $("tUndo").hidden = !undo;
    var t = $("toast"); t.classList.add("show"); clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); last = null; }, 6000);
  }
  $("tUndo").addEventListener("click", function () { if (!last) return; items.push(last); last = null; $("toast").classList.remove("show"); render(); });

  /* ---- right side panel ---- */
  var drawer = null, dOpener = null, dId = null;
  function openDrawer(id, from) {
    var r = byId(id); if (!r) return;
    closeDrawer(true); dOpener = from; dId = id;
    var I0 = INSTS[r.inst], left = leftDays(r), pct = Math.max(0, Math.min(100, Math.round(left / EXPIRE_DAYS * 100)));
    var mcls = left < 0 ? "bad" : left <= 3 ? "" : "ok", mtxt = left < 0 ? "Expired" : left === 0 ? "Expires today" : plural(left, "day") + " left";
    var o = document.createElement("div"); o.className = "d-over";
    o.innerHTML = '<aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dT">' +
      '<div class="d-head"><h2 id="dT">Invitation details</h2><button type="button" class="d-x" data-d="close" aria-label="Close panel">' + I(ICON.x, 18) + "</button></div>" +
      '<div class="d-body">' +
        '<section class="d-sec"><div class="who"><span class="av t' + r.tone + '" style="width:52px;height:52px;font-size:17px">' + initials(r.name) + '</span><div class="who-t"><div class="nm" style="font-size:16px">' + esc(r.name) + '</div><div class="ln">' + I(ICON.mail, 13) + '<a href="mailto:' + esc(r.email) + '">' + esc(r.email) + "</a></div></div></div></section>" +
        '<section class="d-sec"><div class="d-k">Institute</div><div class="inst"><span class="inst-logo">' + img("icon", 34, "inst") + '</span><div class="inst-t"><strong>' + I0.name + '</strong><div class="ln">' + I(ICON.pin, 13) + "<span>" + I0.address + '</span></div><div class="ln">' + I(ICON.globe, 13) + '<a href="https://' + I0.website + '" target="_blank" rel="noopener">' + I0.website + "</a></div></div></div></section>" +
        '<section class="d-sec"><div class="d-k">Products and roles <span class="cnt">' + r.products.length + '</span></div><div class="plist">' +
          r.products.map(function (k) { var P = PRODUCTS[k]; return '<div class="pline ' + P.cls + '"><span class="pi">' + img(P.file, 24, P.fb) + "</span><strong>" + P.name + '</strong><span class="role-pill ' + roleCls(r.roles[k]) + '">' + r.roles[k] + "</span></div>"; }).join("") + "</div></section>" +
        '<section class="d-sec"><div class="d-k">Dates</div><div class="dates"><div><div class="k">Invited on</div><div class="v">' + fmtD(r.at) + '</div></div><div><div class="k">Expires on</div><div class="v">' + fmtD(expiryOf(r.at)) + '</div></div></div>' +
          '<div class="meter ' + mcls + '"><i style="width:' + pct + '%"></i></div><div class="mt" style="color:' + (left < 0 ? "var(--rose)" : left <= 3 ? "var(--yellow)" : "var(--green-deep)") + '">' + mtxt + "</div></section>" +
      "</div>" +
      '<div class="d-foot"><button type="button" class="btn btn-del lg" data-d="delete">' + I(ICON.trash, 16) + "Delete</button>" + (left < 0 ? '<button type="button" class="btn btn-resend lg" data-d="resend">' + I(ICON.resend, 16) + "Resend</button>" : "") + "</div></aside>";
    document.body.appendChild(o); drawer = o; document.body.style.overflow = "hidden";
    o.addEventListener("click", function (e) {
      if (e.target === o || e.target.closest('[data-d="close"]')) { closeDrawer(); return; }
      var b = e.target.closest("[data-d]"); if (!b) return;
      var it = byId(dId); if (!it) return;
      if (b.getAttribute("data-d") === "resend") resend(it); else if (b.getAttribute("data-d") === "delete") openConfirm(it, b);
    });
    setTimeout(function () { var c = o.querySelector(".d-x"); if (c) c.focus(); }, 30);
  }
  function closeDrawer(quiet) {
    if (!drawer) return; drawer.remove(); drawer = null; document.body.style.overflow = "";
    if (!quiet && dOpener && document.body.contains(dOpener)) dOpener.focus();
  }

  /* ---- Add User form ---- */
  var form = null, add = null;
  function openAdd(from) {
    closeModal(); closeDrawer(true); opener = from;
    add = { inst: "", defRole: "Viewer", all: false, emails: [], sel: {}, errors: {} };
    var o = document.createElement("div"); o.className = "overlay";
    o.innerHTML = '<div class="modal au" role="dialog" aria-modal="true" aria-labelledby="auT"><div class="au-body">' +
      '<div class="au-col"><h2 id="auT">Add User</h2><p class="sub">Invite one or more users and give access to products and roles.</p>' +
        '<div class="f"><label for="fInstSel">Institution <span class="req">*</span></label><div class="rsel has-ico" id="wInst"><span class="l-ico" data-i="inst"></span><select id="fInstSel"><option value="">Select institution</option>' + INSTS.map(function (x, i) { return '<option value="' + i + '">' + x.name + ", " + x.city + "</option>"; }).join("") + '</select><span class="chev" data-i="chev"></span></div><div class="ferr" id="eInst" hidden>Please choose an institution.</div></div>' +
        '<div class="f"><label for="fDef">Default role <span class="tip" tabindex="0" aria-label="This role is used for every product you select">' + I(ICON.info, 16) + '<span class="tt">Used for every product you select</span></span></label><div class="rsel has-ico"><span class="l-ico" data-i="user"></span><select id="fDef">' + accessOpts("Viewer") + '</select><span class="chev" data-i="chev"></span></div><div class="hint">This role will be applied to all selected products.</div></div>' +
        '<div class="assign"><span class="ai" data-i="layers"></span><div class="at"><strong>Assign all products</strong><span class="s">Give access to all available products.</span></div><label class="sw" aria-label="Assign all products"><input type="checkbox" id="fAll"><i></i></label></div>' +
        '<div class="f"><label for="fEmail">Email ID(s) <span class="req">*</span></label><div class="chips" id="chips"><input type="text" id="fEmail" placeholder="Type an email and press Enter" autocomplete="off" inputmode="email"></div><div class="hint">Add more than one by separating with a comma or space.</div><div class="ferr" id="eEmail" hidden></div></div>' +
      '</div>' +
      '<div class="au-col"><h2 style="font-size:20px">Products &amp; Roles</h2><p class="sub">Select the products and set a role for each product.</p><div class="pr-list" id="prList">' +
        PKEYS.map(function (k) { var P = PRODUCTS[k]; return '<div class="pr" data-k="' + k + '"><input type="checkbox" class="chk" id="pc-' + k + '" data-pc="' + k + '" aria-label="Select ' + P.name + '"><span class="pi ' + P.cls + '">' + img(P.file, 28, P.fb) + '</span><div><strong>' + P.name + "</strong><small>" + P.desc + '</small></div><div class="rwrap"><div class="rl">Role</div><div class="rsel"><select data-pr="' + k + '" disabled aria-label="Role for ' + P.name + '"><option value="">Select role</option>' + accessOpts("") + '</select><span class="chev">' + I(ICON.chev, 15) + "</span></div></div></div>"; }).join("") +
      '</div><div class="ferr" id="eProd" hidden></div></div></div>' +
      '<div class="au-foot"><button type="button" class="btn btn-ghost" data-m="cancel">Cancel</button><button type="button" class="btn btn-solid" data-m="ok">' + I(ICON.userplus, 18) + "Add User</button></div></div>";
    document.body.appendChild(o); modal = o; form = o; paintIcons(o);
    wireAdd(o);
    setTimeout(function () { var f = o.querySelector("#fInstSel"); if (f) f.focus(); }, 30);
  }
  function wireAdd(o) {
    var q = function (s) { return o.querySelector(s); };
    function renderChips() {
      var c = q("#chips"), inp = q("#fEmail");
      Array.prototype.slice.call(c.querySelectorAll(".ec")).forEach(function (n) { n.remove(); });
      add.emails.forEach(function (em, i) {
        var s = document.createElement("span"); s.className = "ec";
        s.innerHTML = esc(em) + '<button type="button" data-rm="' + i + '" aria-label="Remove ' + esc(em) + '">' + I(ICON.x, 13) + "</button>";
        c.insertBefore(s, inp);
      });
    }
    function commit(raw) {
      var parts = String(raw).split(/[\s,;]+/).filter(Boolean), bad = [];
      parts.forEach(function (p) {
        if (/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(p)) { if (add.emails.indexOf(p.toLowerCase()) < 0) add.emails.push(p.toLowerCase()); }
        else bad.push(p);
      });
      renderChips();
      var e = q("#eEmail");
      if (bad.length) { e.textContent = bad[0] + " is not a valid email address."; e.hidden = false; q("#chips").classList.add("bad"); }
      else if (add.emails.length) { e.hidden = true; q("#chips").classList.remove("bad"); }
      return bad.join(" ");
    }
    var inp = q("#fEmail");
    inp.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === "," || e.key === " " || e.key === ";") { if (inp.value.trim()) { e.preventDefault(); inp.value = commit(inp.value); } else if (e.key === "Enter") e.preventDefault(); }
      else if (e.key === "Backspace" && !inp.value && add.emails.length) { add.emails.pop(); renderChips(); }
    });
    inp.addEventListener("paste", function (e) { var t = (e.clipboardData || window.clipboardData).getData("text"); if (/[\s,;]/.test(t.trim())) { e.preventDefault(); inp.value = commit(t); } });
    inp.addEventListener("blur", function () { if (inp.value.trim()) inp.value = commit(inp.value); });
    inp.addEventListener("input", function () { q("#eEmail").hidden = true; q("#chips").classList.remove("bad"); });
    q("#chips").addEventListener("click", function (e) {
      var rm = e.target.closest("[data-rm]"); if (rm) { add.emails.splice(+rm.getAttribute("data-rm"), 1); renderChips(); return; }
      inp.focus();
    });
    q("#fInstSel").addEventListener("change", function (e) { add.inst = e.target.value; q("#eInst").hidden = true; q("#wInst").classList.remove("bad"); });

    function syncProducts() {
      PKEYS.forEach(function (k) {
        var cb = q('[data-pc="' + k + '"]'), sel = q('[data-pr="' + k + '"]'), on = !!add.sel[k];
        cb.checked = on; sel.disabled = !on; sel.value = on ? (add.sel[k] || "") : "";
        q('.pr[data-k="' + k + '"]').classList.toggle("on", on);
        q('.pr[data-k="' + k + '"] .rsel').classList.remove("bad");
      });
      var all = PKEYS.every(function (k) { return add.sel[k] !== undefined; });
      q("#fAll").checked = all; q("#eProd").hidden = true;
    }
    q("#fDef").addEventListener("change", function (e) { add.defRole = e.target.value; Object.keys(add.sel).forEach(function (k) { add.sel[k] = add.defRole; }); syncProducts(); });
    q("#fAll").addEventListener("change", function (e) {
      add.sel = {}; if (e.target.checked) PKEYS.forEach(function (k) { add.sel[k] = add.defRole; }); syncProducts();
    });
    q("#prList").addEventListener("change", function (e) {
      var t = e.target, k = t.getAttribute("data-pc");
      if (k) { if (t.checked) add.sel[k] = add.defRole; else delete add.sel[k]; syncProducts(); return; }
      k = t.getAttribute("data-pr"); if (k) { add.sel[k] = t.value; q('.pr[data-k="' + k + '"] .rsel').classList.remove("bad"); q("#eProd").hidden = true; }
    });

    o.addEventListener("click", function (e) {
      if (e.target === o || e.target.closest('[data-m="cancel"]')) { closeModal(); return; }
      if (!e.target.closest('[data-m="ok"]')) return;
      if (inp.value.trim()) inp.value = commit(inp.value);
      var ok = true, first = null;
      if (add.inst === "") { q("#eInst").hidden = false; q("#wInst").classList.add("bad"); ok = false; first = first || q("#fInstSel"); }
      if (!add.emails.length) { var ee = q("#eEmail"); if (ee.hidden) { ee.textContent = "Add at least one email address."; ee.hidden = false; } q("#chips").classList.add("bad"); ok = false; first = first || inp; }
      else if (inp.value.trim()) { ok = false; first = first || inp; }
      var chosen = Object.keys(add.sel);
      if (!chosen.length) { var ep = q("#eProd"); ep.textContent = "Select at least one product."; ep.hidden = false; ok = false; first = first || q("[data-pc]"); }
      else chosen.forEach(function (k) { if (!add.sel[k]) { q('.pr[data-k="' + k + '"] .rsel').classList.add("bad"); var ep2 = q("#eProd"); ep2.textContent = "Choose a role for each selected product."; ep2.hidden = false; ok = false; first = first || q('[data-pr="' + k + '"]'); } });
      if (!ok) { if (first) first.focus(); return; }
      var made = 0, dup = 0;
      add.emails.forEach(function (em) {
        var exists = items.some(function (x) { return x.email === em && x.inst === +add.inst && leftDays(x) >= 0; });
        if (exists) { dup++; return; }
        var roles = {}; chosen.forEach(function (k) { roles[k] = add.sel[k]; });
        items.push({ id: nextId++, email: em, name: nameFromEmail(em), inst: +add.inst, products: PKEYS.filter(function (k) { return roles[k]; }), roles: roles, at: new Date(), tone: items.length % 4 });
        made++;
      });
      closeModal(true); form = null;
      clearFilters(); S.sort = "at"; S.dir = "desc"; S.page = 1; render();
      toast(true, made ? plural(made, "invitation") + " sent" : "No new invitations", made ? "Each expires in " + EXPIRE_DAYS + " days" + (dup ? " · " + plural(dup, "email") + " already invited" : "") : plural(dup, "email") + " already invited to this institution", false);
    });
  }
  $("addBtn").addEventListener("click", function (e) { openAdd(e.currentTarget); });
  document.addEventListener("keydown", function (e) { if (e.key !== "Escape") return; if (modal) closeModal(); else closeDrawer(); });

  render();
})();
</script>
</body>
