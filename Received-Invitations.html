<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Received Invitations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout idea: same system as My Request History. Header band (who invited you, actions), quiet body strip (inviter, contact, dates), then role and products. */
  --ink: #14173d;
  --ink-soft: #5b6188;
  --line: #e6eaf2;
  --green: #16a34a;
  --green-deep: #12803c;
  --green-tint: #eaf7ee;
  --green-line: #bfe6cb;
  --blue: #2f6fe4;
  --blue-deep: #1f55b8;
  --blue-tint: #e8f1ff;
  --blue-line: #c9dcfb;
  --yellow: #a8670a;
  --yellow-tint: #fff6dc;
  --yellow-line: #f1dd9c;
  --rose: #c8323f;
  --rose-tint: #fdecee;
  --rose-line: #f6c9ce;
  --slate: #56607f;
  --slate-tint: #eef1f7;
  --slate-line: #d9dfeb;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --shadow: 0 1px 2px rgba(20,23,61,.04), 0 12px 32px -14px rgba(20,23,61,.12);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); color: var(--ink); background: #fff; line-height: 1.45; -webkit-font-smoothing: antialiased; min-height: 100vh; padding: 32px 20px 56px; }
[hidden] { display: none !important; }
button, input, textarea { font: inherit; color: inherit; }
svg { display: block; flex: none; }
a { color: inherit; }
:focus-visible { outline: 3px solid rgba(22,163,74,.35); outline-offset: 2px; }
.pimg { display: block; object-fit: contain; }
.app { width: 100%; max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

/* ---------- Title + search ---------- */
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding: 4px 2px 0; }
.page-head h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
.page-head p { margin: 2px 0 0; font-size: 14px; color: var(--ink-soft); }
.search { position: relative; width: 360px; max-width: 100%; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); pointer-events: none; }
.search input { width: 100%; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; padding: 0 40px 0 42px; font-size: 14.5px; font-weight: 500; transition: border-color .15s, box-shadow .15s; }
.search input::placeholder { color: #a3a9c4; }
.search input:hover { border-color: #cfd6e6; }
.search input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 4px rgba(22,163,74,.12); }
.search .clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-soft); cursor: pointer; display: grid; place-items: center; }
.search .clear:hover { background: var(--rose-tint); color: var(--rose); }

/* ---------- Tabs ---------- */
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { height: 38px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; font-size: 13.5px; font-weight: 700; color: var(--ink-soft); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: background .15s, border-color .15s, color .15s; }
.tab:hover { border-color: #cdd5e6; color: var(--ink); }
.tab .n { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; background: #f1f3f9; color: var(--ink-soft); font-size: 12px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.tab.on { color: var(--c); background: var(--bg); border-color: var(--bl); }
.tab.on .n { background: #fff; color: var(--c); }
.t-all { --c: var(--ink); --bg: #f4f6fb; --bl: #d5dbe9; }
.t-pending { --c: var(--yellow); --bg: var(--yellow-tint); --bl: var(--yellow-line); }
.t-accepted { --c: var(--green-deep); --bg: var(--green-tint); --bl: var(--green-line); }
.t-rejected { --c: var(--rose); --bg: var(--rose-tint); --bl: var(--rose-line); }
.t-expired { --c: var(--slate); --bg: var(--slate-tint); --bl: var(--slate-line); }
.count-line { font-size: 13px; color: var(--ink-soft); font-weight: 600; }

/* ---------- Cards ---------- */
.grid { display: flex; flex-direction: column; gap: 14px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); }
.inv { display: flex; flex-direction: column; overflow: hidden; transition: box-shadow .15s, transform .15s, opacity .22s; }
.inv:hover { box-shadow: 0 1px 2px rgba(20,23,61,.04), 0 16px 34px -16px rgba(20,23,61,.2); }
.inv.leaving { opacity: 0; transform: scale(.98); }

.rq-head { display: flex; align-items: center; gap: 18px; padding: 18px 22px; }
.rq-id { flex: 1; min-width: 0; display: flex; gap: 14px; align-items: center; }
.rq-id > div { min-width: 0; }
.logo-tile { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--tb); border: 1px solid var(--tl); color: var(--tc); flex: none; }
.tone-green { --tb: var(--green-tint); --tl: var(--green-line); --tc: var(--green-deep); }
.tone-blue { --tb: var(--blue-tint); --tl: var(--blue-line); --tc: var(--blue); }
.tone-yellow { --tb: var(--yellow-tint); --tl: var(--yellow-line); --tc: var(--yellow); }
.tone-red { --tb: var(--rose-tint); --tl: var(--rose-line); --tc: var(--rose); }
.rq-name { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -.01em; line-height: 1.25; }
.rq-meta { display: flex; flex-wrap: wrap; gap: 2px 18px; margin-top: 5px; font-size: 13px; font-weight: 500; color: var(--ink-soft); }
.rq-meta span, .rq-meta a { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.rq-meta svg { color: #98a0bb; }
.rq-meta a { color: var(--blue); font-weight: 600; text-decoration: none; }
.rq-meta a svg { color: var(--blue); }
.rq-meta a:hover { text-decoration: underline; }
.rq-side { display: flex; align-items: center; gap: 10px; flex: none; }

.status { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px 0 9px; border-radius: 999px; font-size: 13px; font-weight: 700; border: 1px solid transparent; white-space: nowrap; }
.st-pending { background: var(--yellow-tint); color: var(--yellow); border-color: var(--yellow-line); }
.st-accepted { background: var(--green-tint); color: var(--green-deep); border-color: var(--green-line); }
.st-rejected { background: var(--rose-tint); color: var(--rose); border-color: var(--rose-line); }
.st-expired { background: var(--slate-tint); color: var(--slate); border-color: var(--slate-line); }

.btn { height: 36px; padding: 0 14px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 13px; cursor: pointer; border: 1.5px solid transparent; white-space: nowrap; text-decoration: none; transition: transform .05s, background .15s, box-shadow .15s, border-color .15s; }
.btn:active { transform: translateY(1px); }
.btn-view { background: #fff; color: var(--ink); border-color: var(--line); }
.btn-view:hover { background: #f4f6fb; border-color: #d5dbe9; }
.btn-view svg { color: var(--blue); }
.btn-reject { background: var(--rose-tint); color: var(--rose); border-color: var(--rose-line); }
.btn-reject:hover { background: #fbdde0; }
.btn-accept { background: linear-gradient(180deg, #1fb457 0%, #12923f 100%); color: #fff; box-shadow: 0 8px 18px -10px rgba(18,146,63,.8), inset 0 1px 0 rgba(255,255,255,.25); }
.btn-accept:hover { box-shadow: 0 10px 22px -10px rgba(18,146,63,.95), inset 0 1px 0 rgba(255,255,255,.25); }
.btn-soft { height: 40px; background: #f4f6fb; color: var(--ink); border-color: var(--line); }
.btn-soft:hover { background: #eceff6; }
.btn-danger { height: 40px; background: linear-gradient(180deg, #ef5560, #d63a46); color: #fff; box-shadow: 0 10px 22px -12px rgba(214,58,70,.8), inset 0 1px 0 rgba(255,255,255,.25); }
.btn-primary { height: 40px; background: linear-gradient(180deg, #1fb457 0%, #12923f 100%); color: #fff; box-shadow: 0 10px 22px -12px rgba(18,146,63,.75), inset 0 1px 0 rgba(255,255,255,.25); }

/* ---------- Body ---------- */
.rq-body { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1.3fr) minmax(0, .9fr) minmax(0, 1fr); gap: 0 28px; padding: 16px 22px; background: #fafbfd; border-top: 1px solid var(--line); }
.rq-body.row2 { border-top: 1px dashed var(--line); padding-top: 14px; padding-bottom: 16px; background: #fafbfd; }
.col { min-width: 0; }
.k { display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px; }
.cnt { min-width: 18px; height: 18px; padding: 0 6px; border-radius: 999px; background: #e9edf5; color: var(--ink-soft); font-size: 11px; display: inline-grid; place-items: center; letter-spacing: 0; }
.val { font-size: 14px; font-weight: 700; line-height: 1.3; min-height: 30px; display: flex; align-items: center; }

.by { display: flex; gap: 12px; align-items: flex-start; }
.av { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; flex: none; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); }
.av-ini { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 800; flex: none; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); background: var(--ab); color: var(--ac); }
.by-t { min-width: 0; }
.by-name { display: flex; align-items: center; gap: 6px; font-size: 14.5px; font-weight: 800; line-height: 1.25; }
.by-name svg { color: var(--green); }
.by-line { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500; color: var(--ink-soft); margin-top: 3px; min-width: 0; overflow-wrap: anywhere; }
.by-line svg { color: #98a0bb; }
.by-line a { text-decoration: none; }
.by-line a:hover { color: var(--blue); text-decoration: underline; }
.chip-title { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 7px; font-size: 12px; font-weight: 700; margin-top: 6px; background: var(--blue-tint); color: var(--blue-deep); border: 1px solid var(--blue-line); }

.contact { display: flex; flex-direction: column; gap: 8px; }
.cline { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; min-width: 0; }
.cline .ci { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.ci.g { background: var(--green-tint); color: var(--green-deep); }
.ci.b { background: var(--blue-tint); color: var(--blue); }
.cline a { text-decoration: none; overflow-wrap: anywhere; }
.cline a:hover { color: var(--blue); text-decoration: underline; }

.meter { height: 6px; border-radius: 999px; background: #e9edf5; overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; border-radius: inherit; background: #f0b429; }
.meter.urgent i { background: #ef6b75; }
.sub { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-top: 2px; }
.sub.warn { color: var(--yellow); }
.sub.urgent { color: var(--rose); }

.role-pill { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px 0 9px; border-radius: 9px; font-size: 13.5px; font-weight: 700; background: var(--rb); color: var(--rc); border: 1px solid var(--rl); }
.role-admin { --rb: var(--yellow-tint); --rc: var(--yellow); --rl: var(--yellow-line); }
.role-operator { --rb: var(--green-tint); --rc: var(--green-deep); --rl: var(--green-line); }
.role-viewer { --rb: var(--blue-tint); --rc: var(--blue-deep); --rl: var(--blue-line); }
.role-cap { font-size: 12px; font-weight: 500; color: var(--ink-soft); margin-top: 6px; line-height: 1.4; }

.prods { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.prod { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px 0 8px; border-radius: 12px; background: #fff; border: 1px solid var(--cl); min-width: 0; }
.prod .pi { width: 30px; height: 30px; border-radius: 9px; background: var(--cb); display: grid; place-items: center; flex: none; }
.prod strong { font-size: 13px; line-height: 1.2; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pc-blue { --cb: var(--blue-tint); --cl: var(--blue-line); }
.pc-yellow { --cb: var(--yellow-tint); --cl: var(--yellow-line); }
.pc-green { --cb: var(--green-tint); --cl: var(--green-line); }
.col-prod { grid-column: 2 / -1; border-left: 1px solid var(--line); padding-left: 28px; }

.remark { display: flex; gap: 12px; align-items: flex-start; padding: 13px 22px; background: var(--rose-tint); border-top: 1px solid var(--rose-line); }
.remark .ri { width: 28px; height: 28px; border-radius: 9px; background: #fff; border: 1px solid var(--rose-line); color: var(--rose); display: grid; place-items: center; flex: none; }
.remark .k { color: var(--rose); margin-bottom: 2px; }
.remark p { margin: 0; font-size: 13.5px; font-weight: 600; color: #7d2630; line-height: 1.45; }

/* ---------- Empty ---------- */
.empty { border: 1.5px dashed #c9d3e6; border-radius: 22px; background: #fafbfe; padding: 44px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }
.empty .e-ico { width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center; background: var(--green-tint); color: var(--green-deep); margin-bottom: 6px; }
.empty h3 { margin: 0; font-size: 18px; font-weight: 800; }
.empty p { margin: 0; font-size: 14px; color: var(--ink-soft); max-width: 46ch; }
.empty .btn { margin-top: 10px; height: 40px; }

/* ---------- Modal ---------- */
.overlay { position: fixed; inset: 0; background: rgba(20,23,61,.35); backdrop-filter: blur(2px); display: grid; place-items: center; padding: 20px; z-index: 20; }
.modal { width: 100%; max-width: 460px; background: #fff; border-radius: 22px; padding: 24px; box-shadow: 0 30px 70px -20px rgba(20,23,61,.45); }
.modal .m-ico { width: 48px; height: 48px; border-radius: 15px; display: grid; place-items: center; margin-bottom: 14px; border: 1px solid transparent; }
.m-ico.acc { background: var(--green-tint); color: var(--green-deep); border-color: var(--green-line); }
.m-ico.rej { background: var(--rose-tint); color: var(--rose); border-color: var(--rose-line); }
.modal h3 { margin: 0 0 6px; font-size: 19px; font-weight: 800; }
.modal p { margin: 0; font-size: 14px; color: var(--ink-soft); }
.sumbox { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: #fafbfd; border: 1px solid var(--line); font-size: 13.5px; font-weight: 700; }
.sumbox small { display: block; font-weight: 600; color: var(--ink-soft); font-size: 12.5px; margin-top: 2px; }
.field { margin-top: 14px; }
.field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
.field label span { font-weight: 500; color: var(--ink-soft); }
.field textarea { width: 100%; min-height: 88px; resize: vertical; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; font-weight: 500; transition: border-color .15s, box-shadow .15s; }
.field textarea:focus { outline: none; border-color: var(--rose); box-shadow: 0 0 0 4px rgba(200,50,63,.10); }
.m-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

/* ---------- Toast ---------- */
.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px 10px 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 18px 40px -12px rgba(20,23,61,.25); transition: opacity .2s, transform .2s; width: max-content; max-width: calc(100vw - 32px); z-index: 30; }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast .t-ico { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; }
.toast .t-ico.acc { background: var(--green-tint); color: var(--green-deep); }
.toast .t-ico.rej { background: var(--rose-tint); color: var(--rose); }
.toast strong { display: block; font-size: 13.5px; }
.toast span.b { font-size: 12.5px; color: var(--ink-soft); }
.toast .undo { border: 0; background: #f1f3f9; color: var(--ink); font-weight: 700; font-size: 13px; padding: 7px 12px; border-radius: 9px; cursor: pointer; }
.toast .undo:hover { background: #e6eaf2; }

/* ---------- Detail page ---------- */
.d-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.d-top h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
.d-top p { margin: 2px 0 0; font-size: 14px; color: var(--ink-soft); }
.btn-back { height: 40px; background: #fff; border-color: var(--line); color: var(--ink); padding: 0 16px 0 12px; }
.btn-back:hover { background: #f4f6fb; }
.d-title { display: flex; align-items: center; gap: 14px; }
.hero { padding: 22px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.hero .logo-tile { width: 68px; height: 68px; border-radius: 20px; }
.hero h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
.hero-chips { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.d-grid { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 3fr); gap: 18px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.panel { padding: 20px 22px; }
.panel h3 { margin: 0 0 14px; font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
.panel h3 i { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-style: normal; }
.h-g { background: var(--green-tint); color: var(--green-deep); } .h-b { background: var(--blue-tint); color: var(--blue); }
.h-y { background: var(--yellow-tint); color: var(--yellow); } .h-r { background: var(--rose-tint); color: var(--rose); }
.by-row { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 0; padding: 0; }
.by-row > div { padding: 20px 22px; min-width: 0; }
.by-row .by-contact { border-left: 1px solid var(--line); }
@media (max-width: 760px) { .by-row { grid-template-columns: 1fr; } .by-row .by-contact { border-left: 0; border-top: 1px solid var(--line); } }
.by-big { display: flex; gap: 16px; align-items: center; }
.by-big .av, .by-big .av-ini { width: 64px; height: 64px; font-size: 20px; }
.quote { margin-top: 16px; padding: 14px 16px; border-radius: 14px; background: #fafbfd; border: 1px solid var(--line); font-size: 14px; line-height: 1.55; color: var(--ink); position: relative; }
.quote .k { margin-bottom: 6px; }
.role-block { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
.perm { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.perm li { display: flex; align-items: center; gap: 10px; font-size: 13.5px; font-weight: 600; }
.perm li .pk { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; background: var(--green-tint); color: var(--green-deep); flex: none; }
.perm li.no .pk { background: var(--slate-tint); color: var(--slate); }
.perm li.no { color: var(--ink-soft); font-weight: 500; }
.sep { height: 1px; background: var(--line); margin: 18px 0; }
.plist { display: flex; flex-direction: column; gap: 10px; }
.prow { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--cl); background: #fff; }
.prow .pi { width: 40px; height: 40px; border-radius: 12px; background: var(--cb); display: grid; place-items: center; flex: none; }
.prow strong { display: block; font-size: 14px; }
.prow small { display: block; font-size: 12.5px; color: var(--ink-soft); font-weight: 500; margin-top: 1px; }
.irow { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; }
.irow + .irow { border-top: 1px dashed var(--line); }
.irow:first-child { padding-top: 0; } .irow:last-child { padding-bottom: 0; }
.irow .ci { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.ci.r { background: var(--rose-tint); color: var(--rose); } .ci.y { background: var(--yellow-tint); color: var(--yellow); }
.irow .k { margin-bottom: 2px; }
.irow .iv { font-size: 14px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
.irow .iv a { text-decoration: none; } .irow .iv a:hover { color: var(--blue); text-decoration: underline; }
.steps { list-style: none; margin: 0; padding: 0; }
.step { display: flex; gap: 12px; position: relative; padding-bottom: 16px; }
.step:last-child { padding-bottom: 0; }
.step:not(:last-child)::before { content: ""; position: absolute; left: 13px; top: 28px; bottom: 2px; width: 2px; background: var(--line); }
.step .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; background: #f1f3f9; color: var(--ink-soft); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); }
.step.done .dot { background: var(--green-tint); color: var(--green-deep); box-shadow: 0 0 0 1px var(--green-line); }
.step.now .dot { background: var(--yellow-tint); color: var(--yellow); box-shadow: 0 0 0 1px var(--yellow-line); }
.step.bad .dot { background: var(--rose-tint); color: var(--rose); box-shadow: 0 0 0 1px var(--rose-line); }
.step b { display: block; font-size: 13.5px; } .step small { display: block; font-size: 12.5px; color: var(--ink-soft); font-weight: 500; }
.respond { display: flex; flex-direction: column; gap: 10px; }
.respond p { margin: 0 0 4px; font-size: 13px; color: var(--ink-soft); }
.respond .btn { height: 44px; width: 100%; font-size: 14px; }
.note-box { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; font-size: 13.5px; font-weight: 600; }
.note-g { background: var(--green-tint); border: 1px solid var(--green-line); color: var(--green-deep); }
.note-r { background: var(--rose-tint); border: 1px solid var(--rose-line); color: #7d2630; }
.note-s { background: var(--slate-tint); border: 1px solid var(--slate-line); color: var(--slate); }
.note-box svg { margin-top: 1px; }
.note-box small { display: block; font-weight: 500; margin-top: 2px; }
@media (max-width: 1000px) { .d-grid { grid-template-columns: 1fr; } .hero-chips { margin-left: 0; } }
@media (max-width: 1000px) {
  .rq-head { flex-wrap: wrap; }

}

}

  $("mCancel").addEventListener("click", closeModal);
  $("overlay").addEventListener("click", function (e) { if (e.target === $("overlay")) closeModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("overlay").hidden) closeModal(); });

  $("mOk").addEventListener("click", function () {
    if (!modal) return;
    var r = modal.r, mode = modal.mode, remark = $("mRemark").value.trim();
    $("overlay").hidden = true; modal = null;
    var el = $("grid").querySelector('[data-id="' + r.id + '"]');
    function done() {
      last = { r: r, status: r.status, remark: r.remark };
      r.status = mode === "accept" ? "accepted" : "rejected";
      r.remark = mode === "reject" ? remark : "";
      refresh(); toast(mode, mode === "accept" ? "Invitation accepted" : "Invitation rejected", r.name);
    }
    if (current === null && el && state.tab === "pending") { el.classList.add("leaving"); setTimeout(done, 220); } else done();
  });

  function toast(mode, title, body) {
    $("tIco").className = "t-ico " + (mode === "accept" ? "acc" : "rej");
    $("tIco").innerHTML = I(mode === "accept" ? ICON.check : ICON.x, 17);
    $("tTitle").textContent = title; $("tBody").textContent = body;
    var t = $("toast"); t.classList.add("show"); clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); last = null; }, 6000);
  }
  $("tUndo").addEventListener("click", function () {
    if (!last) return;
    last.r.status = last.status; last.r.remark = last.remark; last = null;
    $("toast").classList.remove("show"); refresh();
  });

  /* ---- detail page (simulated next page) ---- */
  var current = null;
  function find(id) { return state.list.filter(function (r) { return r.id === id; })[0]; }
  function irow(tone, icon, label, val) { return '<div class="irow"><span class="ci ' + tone + '">' + I(ICON[icon], 16) + '</span><div><span class="k">' + label + '</span><div class="iv">' + val + "</div></div></div>"; }
  function detail(r) {
    var st = eff(r), S = STATUS[st], R = ROLES[r.role];
    var inv = parse(r.invited), exp = parse(r.expires), left = daysLeft(r);
    var total = Math.max(1, Math.round((exp - inv) / 86400000)), idx = state.list.indexOf(r);
    var urg = left <= 7, pct = Math.max(0, Math.min(100, Math.round(left / total * 100)));
    var meter = st === "pending" ? '<div class="meter' + (urg ? " urgent" : "") + '"><i style="width:' + pct + '%"></i></div><span class="sub ' + (urg ? "urgent" : "warn") + '">' + (left === 0 ? "Expires today" : left + (left === 1 ? " day left" : " days left")) + "</span>" : "";
    var prods = r.products.map(function (k) { var p = PRODUCTS[k]; return '<div class="prow ' + p.cls + '"><span class="pi">' + img(p.file, 26, p.fb) + "</span><div><strong>" + p.name + "</strong><small>" + PDESC[k] + "</small></div></div>"; }).join("");
    var respond;
    if (st === "pending") respond = '<div class="respond"><p>Accepting gives you access to the products listed here.</p><button type="button" class="btn btn-accept" data-act="accept" data-id="' + r.id + '">' + I(ICON.check, 16) + 'Accept invitation</button><button type="button" class="btn btn-reject" data-act="reject" data-id="' + r.id + '">' + I(ICON.x, 16) + "Reject invitation</button></div>";
    else if (st === "accepted") respond = '<div class="note-box note-g">' + I(ICON.ok, 18) + "<div>You accepted this invitation.<small>You now have access at " + esc(r.name) + ".</small></div></div>";
    else if (st === "rejected") respond = '<div class="note-box note-r">' + I(ICON.no, 18) + "<div>You rejected this invitation." + (r.remark ? "<small>Your reason: " + esc(r.remark) + "</small>" : "") + "</div></div>";
    else respond = '<div class="note-box note-s">' + I(ICON.expired, 18) + "<div>This invitation has expired.<small>Ask " + esc(r.by.name) + " to send a new one.</small></div></div>";
    return '<div class="d-top"><div class="d-title"><button type="button" class="btn btn-back" id="backBtn">' + I('<path d="M15 6l-6 6 6 6"/>', 16) + 'Back</button><div><h1>Invitation details</h1><p>Review everything before you reply.</p></div></div>' +
        '<span class="status st-' + st + '">' + I(ICON[S.icon], 16) + S.label + "</span></div>" +
      '<section class="card hero"><div class="logo-tile tone-' + r.tone + '">' + img("icon", 42, "inst") + '</div><div style="min-width:0"><h2>' + esc(r.name) + '</h2><div class="rq-meta"><span>' + I(ICON.pin, 14) + esc(r.address) + '</span><a href="https://' + esc(r.website) + '" target="_blank" rel="noopener">' + I(ICON.globe, 14) + esc(r.website) + "</a></div></div>" +
        '<div class="hero-chips"><span class="role-pill ' + R.cls + '">' + I(ICON[R.icon], 15) + R.label + '</span><span class="chip-title" style="margin:0;height:30px;font-size:13px">' + r.products.length + (r.products.length === 1 ? " product" : " products") + "</span></div></section>" +
      '<div class="d-grid"><div class="stack">' +
        '<section class="card panel by-row"><div><h3><i class="h-b">' + I(ICON.mail, 15) + '</i>Invited by</h3><div class="by-big">' + avatar(r.by, idx) + '<div class="by-t"><div class="by-name" style="font-size:17px">' + esc(r.by.name) + I(ICON.shield, 17) + '</div><div class="by-line" style="font-size:13.5px">' + I(ICON.mail, 14) + '<a href="mailto:' + esc(r.by.email) + '">' + esc(r.by.email) + '</a></div><span class="chip-title">' + esc(r.by.title) + "</span></div></div></div>" +
        '<div class="by-contact"><h3><i class="h-g">' + I(ICON.phone, 15) + '</i>Institute contact</h3>' +
          irow("g", "phone", "Phone", '<a href="tel:' + esc(r.contact.phone.replace(/\s/g, "")) + '">' + esc(r.contact.phone) + "</a>") +
          irow("b", "mail", "Email", '<a href="mailto:' + esc(r.contact.email) + '">' + esc(r.contact.email) + "</a>") + "</div></section>" +
        '<section class="card panel"><span class="k">Products<span class="cnt">' + r.products.length + '</span></span><div class="plist">' + prods + "</div></section>" +
      '</div><div class="stack">' +
        '<section class="card panel"><h3><i class="h-g">' + I(ICON.check, 15) + "</i>Respond</h3>" + respond + "</section>" +
        '<section class="card panel"><h3><i class="h-y">' + I(ICON.clock, 15) + "</i>Timeline</h3>" +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px"><div><span class="k">Invited on</span><div class="val" style="min-height:0">' + fmt(inv) + '</div></div><div><span class="k">Expires on</span><div class="val" style="min-height:0">' + fmt(exp) + "</div></div></div>" + meter + "</section>" +
      "</div></div>";
  }
  function showDetail(r) {
    current = r.id;
    $("listView").hidden = true; $("detailView").hidden = false;
    $("detailView").innerHTML = detail(r);
    window.scrollTo(0, 0);
  }
  function showList() {
    current = null;
    $("detailView").hidden = true; $("listView").hidden = false; render();
  }
  function route() {
    var m = (location.hash || "").match(/^#invitation-(\d+)$/), r = m && find(+m[1]);
    if (r) showDetail(r); else showList();
  }
  function go(h) { try { location.hash = h; } catch (e) {} route(); }
  function refresh() { if (current !== null && find(current)) showDetail(find(current)); else render(); }
  window.addEventListener("hashchange", route);

  $("grid").addEventListener("click", function (e) {
    var v = e.target.closest("[data-view]"); if (!v) return;
    e.preventDefault(); go("invitation-" + v.getAttribute("data-view"));
  });
  $("detailView").addEventListener("click", function (e) {
    if (e.target.closest("#backBtn")) { go("invitations"); return; }
    var b = e.target.closest("[data-act]"); if (!b) return;
    var r = find(+b.getAttribute("data-id")); if (!r) return;
    opener = b; openModal(b.getAttribute("data-act"), r);
  });

  route();
})();
</script>
</body>
</html>
